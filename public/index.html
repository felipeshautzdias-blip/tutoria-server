<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e4e4e4;
    --bg-dark:#cfcfcf;
    --board:#1f3a2e;
    --board-dark:#132720;
    --frame:#6b4a30;
    --frame-dark:#43301f;
    --chalk:#eef2ea;
    --chalk-dim: rgba(238,242,234,0.62);
    --paper:#efe4c4;
    --paper-edge:#e0d1a6;
    --gold:#cf9f4f;
    --ink:#332a1c;
    --text-dark:#2b2b2b;
    --text-dim:#6b6b6b;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-dark) 100%);
    font-family:'Inter', sans-serif;
    color:var(--text-dark);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 60px;
    position: relative; /* Define referência  para o posicionamento absoluto */
  }
  header{
    text-align:center;
    margin-bottom:32px;
  }
  header h1{
    font-family:'Special Elite', monospace;
    letter-spacing:0.08em;
    font-size:34px;
    margin:0 0 6px;
    color:var(--text-dark);
  }
  header p{
    color:var(--text-dim);
    font-size:15px;
    margin:0;
  }

  /* QUADRO VERDE — moldura ao redor dos cards, tipo quadro-negro na parede cinza */
  .quadro{
    width:100%;
    max-width:640px;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(180deg, var(--board) 0%, var(--board-dark) 100%);
    border:14px solid var(--frame);
    border-image: linear-gradient(180deg, var(--frame), var(--frame-dark)) 1;
    border-radius:4px;
    padding:26px 22px;
    box-shadow:
      0 18px 40px rgba(0,0,0,0.35),
      inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .quadro-titulo{
    font-family:'Special Elite', monospace;
    letter-spacing:0.15em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--chalk-dim);
    text-align:center;
    margin:0 0 16px;
  }

  /* CARDS ESTILO "LOJA DE APPS" */
  .grid{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card{
    background:#ffffff;
    border-radius:16px;
    padding:14px 16px;
    color:var(--text-dark);
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 4px 10px rgba(0,0,0,0.18);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 16px rgba(0,0,0,0.25);
  }
  .card .icone{
    flex:none;
    width:52px;
    height:52px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--gold), #a97a2f);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .card .info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .card h2{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:15.5px;
    margin:0;
    color:var(--text-dark);
  }
  .card p{
    font-size:12.5px;
    margin:0;
    color:var(--text-dim);
    line-height:1.35;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card .abrir{
    flex:none;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.02em;
    color:#fff;
    background:var(--board);
    padding:7px 14px;
    border-radius:20px;
  }
  .card.em-breve{
    opacity:0.5;
    cursor:default;
    pointer-events:none;
  }
  .card.em-breve .abrir{
    background:#9a9a9a;
  }

  footer{
    margin-top:48px;
    color:var(--text-dim);
    font-size:12px;
    text-align:center;
  }

  /* Estilo dos links dos autores no rodapé */
  footer a.autor-link {
    color: inherit;
    text-decoration: none;
    font-weight: 600;
  }
  footer a.autor-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <header>
    <h1>NEXT SCHOOL</h1>
    <p>Escolha um sistema para acessar</p>
  </header>

  <div class="quadro">
    <p class="quadro-titulo">Sistemas disponíveis</p>
    <div class="grid">
      <a class="card" href="/tutoria.html">
        <div class="icone">📘</div>
        <div class="info">
          <h2>Tutoria</h2>
          <p>Tutoria digital.</p>
        </div>
        <span class="abrir">ABRIR</span>
      </a>

      <a class="card" href="/trabalho.html">
        <div class="icone">📝</div>
        <div class="info">
          <h2>Boletim digital</h2>
          <p>Boletim digital.</p>
        </div>
        <span class="abrir">ABRIR</span>
      </a>
    </div>
  </div>

  <footer>
    por <a href="eletric.html" class="autor-link">felipe schaustz dias</a> e <a href="anthony.html" class="autor-link">Anthony Carvalho</a>
  </footer>
</body>
</html>

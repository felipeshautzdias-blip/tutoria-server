<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1f3a2e;
    --board-dark:#132720;
    --frame:#6b4a30;
    --frame-dark:#43301f;
    --chalk:#eef2ea;
    --chalk-dim: rgba(238,242,234,0.62);
    --paper:#efe4c4;
    --paper-edge:#e0d1a6;
    --gold:#cf9f4f;
    --ink:#332a1c;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(180deg, var(--board) 0%, var(--board-dark) 100%);
    font-family:'Inter', sans-serif;
    color:var(--chalk);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 60px;
  }
  header{
    text-align:center;
    margin-bottom:36px;
  }
  header h1{
    font-family:'Special Elite', monospace;
    letter-spacing:0.08em;
    font-size:34px;
    margin:0 0 6px;
    color:var(--chalk);
  }
  header p{
    color:var(--chalk-dim);
    font-size:15px;
    margin:0;
  }
  .grid{
    width:100%;
    max-width:920px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
    gap:20px;
  }
  .card{
    background:var(--paper);
    border:1px solid var(--paper-edge);
    border-radius:10px;
    padding:22px 20px;
    color:var(--ink);
    text-decoration:none;
    display:flex;
    flex-direction:column;
    gap:10px;
    box-shadow:0 6px 14px rgba(0,0,0,0.25);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(0,0,0,0.32);
  }
  .card .icone{
    font-size:30px;
  }
  .card h2{
    font-family:'Special Elite', monospace;
    font-size:18px;
    margin:0;
    letter-spacing:0.03em;
  }
  .card p{
    font-size:13.5px;
    margin:0;
    color:#5a4d34;
    line-height:1.4;
  }
  .card .abrir{
    margin-top:auto;
    font-family:'Special Elite', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    color:var(--gold);
  }
  .card.em-breve{
    opacity:0.55;
    cursor:default;
    pointer-events:none;
  }
  footer{
    margin-top:48px;
    color:var(--chalk-dim);
    font-size:12px;
    text-align:center;
  }
</style>
</head>
<body>

  <header>
    <h1>NEXT SCHOOL</h1>
    <p>Escolha um sistema para acessar</p>
  </header>

  <div class="grid">
    <a class="card" href="/tutoria.html">
      <div class="icone">📘</div>
      <h2>Tutoria</h2>
      <p>Boletim digital — portal de alunos, professores e diretoria.</p>
      <span class="abrir">ABRIR →</span>
    </a>

  <div class="grid">
    <a class="card" href="/tutoria.html">
      <div class="icone">📘</div>
      <h2>Tutoria</h2>
      <p>Boletim digital — portal de alunos, professores e diretoria.</p>
      <span class="abrir">ABRIR →</span>
    </a>

  <footer>nextscholl.com.br</footer>

</body>
</html>

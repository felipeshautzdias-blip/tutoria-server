<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Unificado — Conecte Escola</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --board:#1f3a2e;
    --board-dark:#132720;
    --frame:#6b4a30;
    --chalk:#eef2ea;
    --chalk-dim: rgba(238,242,234,0.62);
    --paper:#efe4c4;
    --paper-edge:#e0d1a6;
    --ink:#332a1c;
    --gold:#cf9f4f;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }

  body{
    height:100vh;
    display:flex;
    flex-direction:column;
    font-family:'Inter', sans-serif;
    background:var(--board);
    color:var(--chalk);
    overflow:hidden;
  }

  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:12px 16px;
    background:var(--board-dark);
    border-bottom:3px solid var(--frame);
    flex-wrap:wrap;
  }

  .topbar .brand{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:22px;
    color:var(--gold);
    margin-right:12px;
    white-space:nowrap;
  }

  .switch-btn{
    font-family:'Special Elite', monospace;
    font-size:12px;
    letter-spacing:0.03em;
    padding:9px 18px;
    border-radius:20px;
    border:1px solid rgba(238,242,234,0.35);
    background:var(--board);
    color:var(--chalk-dim);
    cursor:pointer;
    transition:all .2s ease;
  }
  .switch-btn:hover{
    color:var(--chalk);
    border-color:var(--gold);
  }
  .switch-btn.active{
    background:var(--paper);
    color:var(--ink);
    border-color:var(--paper-edge);
    font-weight:bold;
    transform:translateY(-1px);
  }

  .frame-wrap{
    flex:1 1 auto;
    position:relative;
    min-height:0;
  }

  iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    display:none;
    background:var(--board);
  }
  iframe.active{ display:block; }

  .loading-msg{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Special Elite', monospace;
    color:var(--chalk-dim);
    font-size:13px;
  }
</style>
</head>
<body>

  <div class="topbar">
    <span class="brand">Portal Escolar</span>
    <button class="switch-btn active" id="btn-escola" onclick="mostrar('escola')">📋 Conecte Escola</button>
    <button class="switch-btn" id="btn-tutoria" onclick="mostrar('tutoria')">🎓 Tutoria</button>
  </div>

  <div class="frame-wrap">
    <div class="loading-msg" id="loading-msg">Carregando…</div>
    <iframe id="frame-escola" title="Conecte Escola"></iframe>
    <iframe id="frame-tutoria" title="Tutoria"></iframe>
  </div>

<script>
  function decodeB64Utf8(b64){
    const binStr = atob(b64);
    const bytes = Uint8Array.from(binStr, c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  function montarIframe(idIframe, idDados){
    const iframe = document.getElementById(idIframe);
    if(iframe.dataset.montado === '1') return;
    const b64 = document.getElementById(idDados).textContent.trim();
    const html = decodeB64Utf8(b64);
    // srcdoc preserva acesso ao localStorage (blob: URL bloqueia, por ter origem nula)
    iframe.setAttribute('srcdoc', html);
    iframe.dataset.montado = '1';
  }

  function mostrar(qual){
    document.getElementById('loading-msg').style.display = 'none';
    montarIframe('frame-escola', 'data-escola');
    montarIframe('frame-tutoria', 'data-tutoria');

    document.getElementById('frame-escola').classList.toggle('active', qual==='escola');
    document.getElementById('frame-tutoria').classList.toggle('active', qual==='tutoria');
    document.getElementById('btn-escola').classList.toggle('active', qual==='escola');
    document.getElementById('btn-tutoria').classList.toggle('active', qual==='tutoria');
  }

  // Inicializa já no Conecte Escola
  mostrar('escola');
</script>

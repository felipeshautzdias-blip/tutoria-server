<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e4e4e4;
    --bg-dark:#cfcfcf;
    --board:#1f3a2e;
    --board-dark:#132720;
    --frame:#6b4a30;
    --frame-dark:#43301f;
    --chalk:#eef2ea;
    --chalk-dim: rgba(238,242,234,0.62);
    --paper:#efe4c4;
    --paper-edge:#e0d1a6;
    --gold:#cf9f4f;
    --ink:#332a1c;
    --text-dark:#2b2b2b;
    --text-dim:#6b6b6b;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    /* Parede de sala de aula: vinheta de luz + listras sutis + tom quente */
    background:
      radial-gradient(ellipse at 50% 18%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 60%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.18) 100%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.018) 0 2px, rgba(255,255,255,0.02) 2px 4px),
      linear-gradient(180deg, #e3dccb 0%, #cfc7b2 100%);
    background-attachment: fixed;
    font-family:'Inter', sans-serif;
    color:var(--text-dark);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 20px 60px;
    position: relative; /* Define referência  para o posicionamento absoluto */
  }
  header{
    text-align:center;
    margin-bottom:32px;
  }
  header h1{
    font-family:'Special Elite', monospace;
    letter-spacing:0.08em;
    font-size:34px;
    margin:0 0 6px;
    color:var(--text-dark);
  }
  header p{
    color:var(--text-dim);
    font-size:15px;
    margin:0;
  }

  /* QUADRO VERDE — moldura ao redor dos cards, tipo quadro-negro na parede cinza */
  .quadro{
    width:100%;
    max-width:1100px;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(180deg, var(--board) 0%, var(--board-dark) 100%);
    border:14px solid var(--frame);
    border-image: linear-gradient(180deg, var(--frame), var(--frame-dark)) 1;
    border-radius:4px;
    padding:26px 22px;
    box-shadow:
      0 18px 40px rgba(0,0,0,0.35),
      inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .quadro-titulo{
    font-family:'Special Elite', monospace;
    letter-spacing:0.15em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--chalk-dim);
    text-align:center;
    margin:0 0 16px;
  }

  /* CARDS ESTILO "LOJA DE APPS" */
  .grid{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card{
    background:#ffffff;
    border-radius:16px;
    padding:14px 16px;
    color:var(--text-dark);
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:0 4px 10px rgba(0,0,0,0.18);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 16px rgba(0,0,0,0.25);
  }
  .card .icone{
    flex:none;
    width:52px;
    height:52px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--gold), #a97a2f);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .card .info{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .card h2{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:15.5px;
    margin:0;
    color:var(--text-dark);
  }
  .card p{
    font-size:12.5px;
    margin:0;
    color:var(--text-dim);
    line-height:1.35;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card .abrir{
    flex:none;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.02em;
    color:#fff;
    background:var(--board);
    padding:7px 14px;
    border-radius:20px;
  }
  .card.em-breve{
    opacity:0.5;
    cursor:default;
    pointer-events:none;
  }
  .card.em-breve .abrir{
    background:#9a9a9a;
  }

  footer{
    margin-top:48px;
    color:var(--text-dark);
    font-size:13.5px;
    text-align:center;
  }

  /* Detalhe de giz no cabeçalho */
  header h1::after{
    content:"";
    display:block;
    width:140px;
    height:3px;
    margin:10px auto 0;
    border-radius:3px;
    background:repeating-linear-gradient(90deg, var(--board) 0 10px, transparent 10px 14px);
    opacity:.7;
  }

  /* Título com aspecto de giz */
  .quadro-titulo{
    color:var(--chalk);
    text-shadow:0 0 1px rgba(255,255,255,.7), 1px 1px 0 rgba(255,255,255,.12);
    opacity:.85;
  }

  /* ÁREA DE DESENHO */
  .desenho{
    margin-top:22px;
    padding-top:16px;
    border-top:2px dashed var(--chalk-dim);
  }
  .desenho .quadro-titulo{ margin-bottom:10px; }
  .ferramentas{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:10px;
  }
  /* BANDEJA DE GIZ (calha de metal sob o quadro) */
  .bandeja{
    display:flex;
    align-items:flex-end;
    gap:10px;
    min-height:48px;
    margin-top:6px;
    padding:8px 14px;
    background:linear-gradient(180deg, #d9dbd7 0%, #aeb2ad 55%, #8c908b 100%);
    border-radius:2px 2px 6px 6px;
    box-shadow:0 4px 8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .cor{
    width:46px;
    height:12px;
    padding:0;
    border:none;
    border-radius:3px;
    cursor:pointer;
    transform:rotate(-3deg);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.35), 0 2px 2px rgba(0,0,0,.35);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cor:hover{ transform:rotate(-3deg) translateY(-3px); }
  .cor.ativo{
    transform:rotate(-3deg) translateY(-7px);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.35), 0 6px 6px rgba(0,0,0,.4);
  }

  /* APAGADOR (base de madeira + feltro azul) */
  .apagador{
    margin-left:auto;
    width:70px;
    height:26px;
    padding:0;
    border:none;
    border-radius:4px;
    cursor:pointer;
    background:linear-gradient(180deg, #2f5d9e 0 55%, #b99a68 55% 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.2), 0 3px 3px rgba(0,0,0,.4);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .apagador:hover{ transform:translateY(-3px); }
  .apagador.ativo{
    transform:translateY(-7px);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.2), 0 7px 6px rgba(0,0,0,.4), 0 0 0 2px rgba(255,255,255,.6);
  }
  .btn-giz{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12px;
    color:var(--chalk);
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.3);
    border-radius:16px;
    padding:6px 12px;
    cursor:pointer;
  }
  .btn-giz.ativo{ background:rgba(255,255,255,.28); border-color:#fff; }
  .btn-giz:hover{ background:rgba(255,255,255,.2); }
  .espessura{ width:80px; accent-color:var(--chalk); }
  #lousa{
    display:block;
    width:100%;
    height:340px;
    border-radius:4px;
    background:
      radial-gradient(ellipse at center, rgba(255,255,255,0.04), transparent 70%),
      rgba(0,0,0,0.12);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
    touch-action:none;
    cursor:crosshair;
  }

  /* Estilo dos links dos autores no rodapé */
  footer a.autor-link {
    color: inherit;
    text-decoration: none;
    font-weight: 600;
  }
  footer a.autor-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <header>
    <h1>NEXT SCHOOL</h1>
    <p>Escolha um sistema para acessar</p>
  </header>

  <div class="quadro">
    <p class="quadro-titulo">Sistemas disponíveis</p>
    <div class="grid">
      <a class="card" href="/tutoria.html">
        <div class="icone">📘</div>
        <div class="info">
          <h2>Tutoria</h2>
          <p>Tutoria digital.</p>
        </div>
        <span class="abrir">ABRIR</span>
      </a>
    </div>

    <div class="desenho">
      <p class="quadro-titulo">Quadro livre — desenhe à vontade</p>
      <div class="ferramentas">
        <input class="espessura" id="espessura" type="range" min="2" max="14" value="4" aria-label="Espessura">
        <button class="btn-giz" id="limpar">Limpar tudo</button>
      </div>
      <canvas id="lousa"></canvas>
      <div class="bandeja">
        <button class="cor ativo" data-cor="#eef2ea" style="background:#eef2ea" aria-label="Giz branco" title="Giz branco"></button>
        <button class="cor" data-cor="#f2d46b" style="background:#f2d46b" aria-label="Giz amarelo" title="Giz amarelo"></button>
        <button class="cor" data-cor="#f09ab4" style="background:#f09ab4" aria-label="Giz rosa" title="Giz rosa"></button>
        <button class="cor" data-cor="#7fc4f0" style="background:#7fc4f0" aria-label="Giz azul" title="Giz azul"></button>
        <button class="apagador" id="borracha" aria-label="Apagador" title="Apagador"></button>
      </div>
    </div>
  </div>

  <footer>
    por <a href="eletric.html" class="autor-link">felipe schaustz dias</a> e <a href="anthony.html" class="autor-link">Anthony Carvalho</a>
  </footer>

<script>
(function(){
  const cv = document.getElementById('lousa');
  const ctx = cv.getContext('2d');
  let cor = '#eef2ea', borracha = false, desenhando = false, ultimo = null;

  function ajustar(){
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (cv.width === w && cv.height === h) return;
    const tmp = document.createElement('canvas');
    tmp.width = cv.width; tmp.height = cv.height;
    if (cv.width) tmp.getContext('2d').drawImage(cv, 0, 0);
    cv.width = w; cv.height = h;
    if (tmp.width) ctx.drawImage(tmp, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
  ajustar();
  window.addEventListener('resize', ajustar);

  function pos(e){
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    return { x:(e.clientX - r.left) * dpr, y:(e.clientY - r.top) * dpr };
  }
  function espessura(){
    return Number(document.getElementById('espessura').value) * (window.devicePixelRatio || 1);
  }
  function tracar(a, b){
    ctx.globalCompositeOperation = borracha ? 'destination-out' : 'source-over';
    ctx.strokeStyle = cor;
    ctx.lineWidth = borracha ? espessura() * 4 : espessura();
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  cv.addEventListener('pointerdown', e => {
    desenhando = true; ultimo = pos(e);
    cv.setPointerCapture(e.pointerId);
    tracar(ultimo, { x:ultimo.x + 0.01, y:ultimo.y });
  });
  cv.addEventListener('pointermove', e => {
    if (!desenhando) return;
    const p = pos(e); tracar(ultimo, p); ultimo = p;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev =>
    cv.addEventListener(ev, () => { desenhando = false; }));

  const btnBorracha = document.getElementById('borracha');
  document.querySelectorAll('.cor').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.cor').forEach(x => x.classList.remove('ativo'));
    b.classList.add('ativo');
    cor = b.dataset.cor; borracha = false;
    btnBorracha.classList.remove('ativo');
  }));
  btnBorracha.addEventListener('click', () => {
    borracha = !borracha;
    btnBorracha.classList.toggle('ativo', borracha);
  });
  document.getElementById('limpar').addEventListener('click', () =>
    ctx.clearRect(0, 0, cv.width, cv.height));
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORTAL UNIFICADO</title>
<style>
  :root {
    --portal-bg: #101816;
    --portal-panel: #183226;
    --portal-panel-2: #1f3a2e;
    --portal-text: #eef2ea;
    --portal-muted: rgba(238,242,234,.72);
    --portal-gold: #cf9f4f;
    --portal-red: #a8352a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
  body {
    background:
      radial-gradient(circle at 20% 0%, rgba(207,159,79,.12), transparent 35%),
      radial-gradient(circle at 90% 100%, rgba(44,74,124,.14), transparent 40%),
      var(--portal-bg);
    color: var(--portal-text);
    font-family: Inter, Arial, sans-serif;
    overflow-x: hidden;
  }
  .portal-nav {
    position: sticky;
    top: 0;
    z-index: 10000;
    width: 100%;
    padding: 12px 16px;
    background: rgba(16,24,22,.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(238,242,234,.14);
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
  }
  .portal-inner {
    width: min(1500px, 100%);
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .portal-title {
    margin-right: auto;
    font-weight: 800;
    letter-spacing: .08em;
    font-size: clamp(15px, 2vw, 20px);
    white-space: nowrap;
  }
  .portal-subtitle {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--portal-muted);
  }
  .portal-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .portal-btn {
    appearance: none;
    border: 1px solid rgba(238,242,234,.2);
    background: rgba(238,242,234,.06);
    color: var(--portal-text);
    border-radius: 12px;
    padding: 11px 15px;
    min-height: 44px;
    font: 700 13px Inter, Arial, sans-serif;
    cursor: pointer;
    transition: .18s ease;
    touch-action: manipulation;
  }
  .portal-btn:hover { transform: translateY(-1px); background: rgba(238,242,234,.1); }
  .portal-btn.active {
    background: linear-gradient(135deg, var(--portal-gold), #b8792f);
    color: #241d14;
    border-color: transparent;
    box-shadow: 0 8px 20px rgba(207,159,79,.25);
  }
  .portal-main { width: 100%; min-height: calc(100vh - 83px); }
  .module { display: none; width: 100%; }
  .module.active { display: block; }
  .module-frame {
    display: block;
    width: 100%;
    height: calc(100vh - 83px);
    min-height: 650px;
    border: 0;
    margin: 0;
    padding: 0;
    background: transparent;
  }
  @media (max-width: 680px) {
    .portal-nav { padding: 10px; }
    .portal-inner { gap: 9px; }
    .portal-title { width: 100%; margin-right: 0; }
    .portal-actions { width: 100%; }
    .portal-btn { flex: 1 1 0; min-width: 0; padding: 11px 10px; font-size: 12px; }
    .module-frame { height: calc(100vh - 126px); min-height: 620px; }
  }
</style>
</head>
<body>
  <nav class="portal-nav" aria-label="Navegação principal do Portal Unificado">
    <div class="portal-inner">
      <div class="portal-title">
        PORTAL UNIFICADO
        <span class="portal-subtitle">Selecione o sistema que deseja acessar</span>
      </div>
      <div class="portal-actions">
        <button class="portal-btn active" id="btn-conect" type="button" aria-controls="modulo-conect" aria-selected="true">🏫 Conect Escola</button>
        <button class="portal-btn" id="btn-tutoria" type="button" aria-controls="modulo-tutoria" aria-selected="false">📚 Tutoria</button>
      </div>
    </div>
  </nav>

  <main class="portal-main">
    <section class="module active" id="modulo-conect" aria-hidden="false">
      <iframe class="module-frame" id="frame-conect" title="Conect Escola 8 + Kanban"></iframe>
    </section>
    <section class="module" id="modulo-tutoria" aria-hidden="true">
      <iframe class="module-frame" id="frame-tutoria" title="Tutoria"></iframe>
    </section>
  </main>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Escolar — Boletim Digital & Portal Unificado</title>
<!-- Biblioteca Externa para Gerar PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --board:#1f3a2e;
    --board-dark:#132720;
    --frame:#6b4a30;
    --frame-dark:#43301f;
    --chalk:#eef2ea;
    --chalk-dim: rgba(238,242,234,0.62);
    --paper:#efe4c4;
    --paper-edge:#e0d1a6;
    --paper-shadow:#8a7145;
    --ink:#332a1c;
    --pen-red:#a8352a;
    --pen-blue:#2c4a7c;
    --pen-green:#2e6b4f;
    --gold:#cf9f4f;
    --rule: rgba(51,42,28,0.16);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(ellipse at 80% 85%, rgba(255,255,255,0.04), transparent 45%),
      var(--board);
    font-family:'Inter', sans-serif;
    color:var(--chalk);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 18px 90px;
    position:relative;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    border:16px solid var(--frame);
    border-image: linear-gradient(180deg, var(--frame), var(--frame-dark)) 1;
    pointer-events:none !important;
    z-index:0;
  }

  body::after{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.5) 0.6px, transparent 0.6px),
      radial-gradient(circle, rgba(255,255,255,0.35) 0.5px, transparent 0.5px);
    background-size: 140px 140px, 90px 90px;
    background-position: 0 0, 40px 60px;
    opacity:0.5;
    pointer-events:none !important;
    z-index:0;
  }

  .stage{
    position:relative;
    z-index:10;
    width:100%;
    max-width:680px;
  }

  .board-header{
    text-align:center;
    margin-bottom:20px;
  }
  .board-header .eyebrow{
    font-family:'Special Elite', monospace;
    letter-spacing:0.32em;
    font-size:11px;
    text-transform:uppercase;
    color:var(--chalk-dim);
  }
  .board-header h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(38px, 7vw, 54px);
    margin:4px 0 2px;
    color:var(--chalk);
    text-shadow: 0 0 1px rgba(238,242,234,0.3);
  }
  .underline-svg{
    display:block;
    margin:0 auto;
    width:220px;
    height:14px;
  }

  /* SELETOR DE PERFIL */
  .profile-selector {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 15px 0 20px;
    flex-wrap: wrap;
  }
  .profile-btn {
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid rgba(238,242,234,0.4);
    background: var(--board-dark);
    color: var(--chalk-dim);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .profile-btn:hover, .profile-btn.active {
    background: var(--paper);
    color: var(--ink);
    border-color: var(--paper-edge);
    font-weight: bold;
    transform: translateY(-2px);
  }

  .steps{
    display:flex;
    justify-content:center;
    gap:4px;
    margin:15px 0 -1px;
    position:relative;
    z-index:11;
    flex-wrap:wrap;
  }
  .step-tab{
    font-family:'Special Elite', monospace;
    font-size:10px;
    letter-spacing:0.04em;
    color:var(--chalk-dim);
    background:var(--board-dark);
    border:1px solid rgba(238,242,234,0.25);
    border-bottom:none;
    padding:7px 8px 9px;
    border-radius:8px 8px 0 0;
    opacity:0.55;
    transition: opacity .2s ease, color .2s ease;
  }
  .step-tab.active{
    opacity:1;
    color:var(--ink);
    background:var(--paper);
    border-color:var(--paper-edge);
  }
  .step-tab.done{ opacity:0.85; }

  .ficha{
    background: var(--paper);
    background-image: linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 34px;
    background-position: 0 84px;
    color:var(--ink);
    border-radius: 4px 14px 14px 14px;
    position:relative;
    box-shadow: 0 22px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(51,42,28,0.06);
  }
  .ficha::before{
    content:"";
    position:absolute;
    left:54px; top:0; bottom:0;
    width:2px;
    background: rgba(168,53,42,0.35);
    pointer-events:none;
  }
  .furos{
    position:absolute;
    left:20px; top:26px; bottom:26px;
    width:14px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    pointer-events:none;
  }
  .furos span{
    width:14px; height:14px;
    border-radius:50%;
    background: var(--board-dark);
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.5);
  }

  .panel{
    padding:34px 34px 34px 78px;
    position:relative;
    z-index:5;
  }

  label{
    display:block;
    font-family:'Special Elite', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    color:var(--pen-blue);
    margin-bottom:5px;
  }
  input[type="text"], input[type="password"], input[type="number"], input[type="tel"], select{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:10px 12px;
    border:1.5px solid rgba(51,42,28,0.25);
    border-radius:6px;
    background:#fbf7ea;
    color:var(--ink);
    margin-bottom:6px;
    position:relative;
    z-index:20;
    pointer-events:auto !important;
  }
  input:focus, select:focus{ outline:2px solid var(--pen-blue); outline-offset:1px; }

  textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:10px 12px;
    border:1.5px solid rgba(51,42,28,0.25);
    border-radius:6px;
    background:#fbf7ea;
    color:var(--ink);
    margin-bottom:6px;
    resize:vertical;
    position:relative;
    z-index:20;
    pointer-events:auto !important;
  }
  textarea:focus{ outline:2px solid var(--pen-blue); outline-offset:1px; }

  .registro-card{
    background:#fbf7ea;
    border:1.5px solid rgba(51,42,28,0.18);
    border-left:4px solid var(--pen-blue);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .registro-card.tipo-advertencia{ border-left-color: var(--pen-red); }
  .registro-card.tipo-elogio{ border-left-color: var(--pen-green); }
  .registro-header{
    display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:6px;
  }
  .registro-tag{
    font-family:'Special Elite', monospace; font-size:11px;
    background: var(--pen-blue); color:#fff; padding:3px 9px; border-radius:20px;
  }
  .registro-data{ font-size:12px; color: rgba(51,42,28,0.6); font-family:'Special Elite', monospace; }
  .registro-texto{ font-size:13px; line-height:1.5; margin:4px 0; }
  .registro-texto strong{ color: var(--pen-blue); }
  .registro-footer{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .registro-autor{ font-size:11px; color: rgba(51,42,28,0.55); font-style:italic; }

  .ra-group {
    display: grid;
    grid-template-columns: 1fr 70px;
    gap: 10px;
  }

  .campo{ margin-bottom:6px; }

  .erro{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:20px;
    color:var(--pen-red);
    min-height:24px;
    margin: 4px 0 10px;
    transform: rotate(-0.5deg);
  }
  
  .sucesso{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:22px;
    color:var(--pen-green);
    min-height:24px;
    margin: 4px 0 10px;
  }

  .btn{
    font-family:'Special Elite', monospace;
    letter-spacing:0.06em;
    font-size:14px;
    padding:12px 18px;
    width:100%;
    border:none;
    border-radius:6px;
    background: var(--pen-blue);
    color:var(--chalk);
    cursor:pointer;
    transition: transform .12s ease, background .2s ease;
    position:relative;
    z-index:20;
    margin-top: 5px;
  }
  .btn:hover{ background:#233d68; transform:translateY(-1px); }
  .btn:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  .btn-ghost{
    background:transparent;
    color:var(--pen-blue);
    border:1.5px solid var(--pen-blue);
    margin-top:10px;
  }
  .btn-ghost:hover{ background:rgba(44,74,124,0.08); }
  
  .btn-green { background: var(--pen-green); }
  .btn-green:hover { background: #23543d; }

  .btn-pdf { background: #8a3b14; color: #fff; }
  .btn-pdf:hover { background: #6e2e0f; }

  .tabela-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top: 10px; }

  .acoes-cell{ display:flex; gap:6px; flex-wrap:wrap; }

  .btn-selecionar, .btn-excluir, .btn-editar{
    font-family:'Special Elite', monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:5px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .btn-selecionar{ border:1.5px solid var(--pen-blue); background:transparent; color:var(--pen-blue); }
  .btn-selecionar:hover{ background:var(--pen-blue); color:var(--chalk); }

  .btn-excluir{ border:1.5px solid var(--pen-red); background:transparent; color:var(--pen-red); }
  .btn-excluir:hover{ background:var(--pen-red); color:var(--chalk); }

  .btn-editar{ border:1.5px solid #8a6318; background:transparent; color:#8a6318; }
  .btn-editar:hover{ background:var(--gold); color:var(--ink); }

  .vazio-tabela{ text-align:center; color:rgba(51,42,28,0.55); font-style:italic; padding: 20px 0; }

  .aluno-selecionado-box{
    background:#fbf7ea;
    border:1.5px dashed var(--pen-blue);
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:18px;
  }
  .aluno-selecionado-texto{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:20px;
    color:var(--pen-blue);
    margin:0;
  }

  .saudacao{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:30px;
    margin:0 0 2px;
    color:var(--ink);
  }
  .sub{
    font-size:13px;
    color:rgba(51,42,28,0.6);
    margin:0 0 18px;
  }

  .grade-row{
    display:grid; grid-template-columns: 1fr 96px;
    align-items:center; gap:14px; margin-bottom:10px;
  }
  .grade-row label{ margin-bottom:0; }
  .grade-row input{ margin-bottom:0; text-align:center; font-family:'Special Elite', monospace; }

  .boletim-table{
    width:100%; border-collapse:collapse;
    margin: 12px 0 20px; font-family:'Special Elite', monospace; font-size:13px;
  }
  .boletim-table th, .boletim-table td{
    text-align:left; padding:8px 6px; border-bottom:1px dashed rgba(51,42,28,0.3);
  }
  .boletim-table th{ color: var(--pen-blue); font-weight:400; letter-spacing:0.04em; }
  .boletim-table td.num{ text-align:right; }
  .boletim-table tr.media td{
    border-bottom:none; border-top:2px solid var(--ink); font-weight:700; color:var(--pen-red);
  }

  .stamp-wrap{ position:relative; display:flex; justify-content:center; margin: 6px 0 16px; }
  .stamp{
    font-family:'Special Elite', monospace; font-size:24px; letter-spacing:0.1em;
    padding:10px 22px; border:4px double currentColor; border-radius:8px;
    transform:rotate(-6deg); text-transform:uppercase; opacity:0.92; mix-blend-mode:multiply;
  }
  .stamp.ok{ color:var(--pen-green); }
  .stamp.rec{ color:var(--pen-red); }

  .resultado-texto{ text-align:center; line-height:1.5; margin-bottom:6px; }
  .resultado-nome{
    text-align:center; font-family:'Caveat', cursive; font-size:22px;
    color:rgba(51,42,28,0.65); margin: -6px 0 14px;
  }

  .busca-box {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  /* ESTRUTURA PARA FORMATAÇÃO DO PDF */
  #area-impressao-pdf {
    background: #ffffff;
    color: #000000;
    padding: 24px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    width: 100%;
    box-sizing: border-box;
    overflow: visible;
  }
  #area-impressao-pdf table {
    width: 100%;
    border-collapse: collapse;
  }

  .hidden{ display:none !important; }

  .clip{
    position:absolute; top:-14px; right:36px; width:34px; height:52px; z-index:4;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.35)); pointer-events:none;
  }

  footer.credit{
    text-align:center; margin-top:22px; font-family:'Special Elite', monospace;
    font-size:11px; letter-spacing:0.08em; color: var(--chalk-dim);
  }
  
  .reset-link {
      color: var(--chalk-dim);
      text-decoration: underline;
      cursor: pointer;
      margin-top: 10px;
      display: inline-block;
  }
  .reset-link:hover { color: var(--chalk); }

  @media (max-width:480px){
    .panel{ padding:30px 18px 30px 58px; }
    .ficha::before{ left:38px; }
    .furos{ left:12px; }
    .acoes-cell { flex-direction: column; }
  }

/* ===== KANBAN INTERATIVO ===== */
#kanban-launcher{
  position:fixed; right:24px; bottom:24px; z-index:1000;
  border:0; border-radius:999px; padding:13px 18px;
  background:linear-gradient(135deg,#cf9f4f,#a8352a);
  color:#fff; font:700 13px 'Inter',sans-serif; cursor:pointer;
  box-shadow:0 12px 30px rgba(0,0,0,.35); transition:.2s;
}
#kanban-launcher:hover{transform:translateY(-3px) scale(1.02)}
#kanban-overlay{
  position:fixed; inset:0; z-index:999; display:none;
  background:rgba(10,18,15,.78); backdrop-filter:blur(8px);
  padding:22px;
}
#kanban-overlay.open{display:flex; animation:kbFade .2s ease}
@keyframes kbFade{from{opacity:0}to{opacity:1}}
#kanban-app{
  width:min(1400px,100%); height:min(900px,100%);
  margin:auto; background:#e8dcc0; color:#2d261b; border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.55); overflow:hidden;
  display:flex; flex-direction:column;
}
.kb-topbar{
  padding:16px 20px; display:flex; gap:14px; align-items:center;
  background:#183226; color:#eef2ea; flex-wrap:wrap;
}
.kb-brand{margin-right:auto}.kb-brand strong{display:block;font-size:18px}
.kb-brand span{font-size:11px;opacity:.65}
.kb-search{min-width:220px; flex:1; max-width:360px}
.kb-search input,.kb-input,.kb-select,.kb-textarea{
  width:100%; border:1px solid rgba(51,42,28,.2); border-radius:9px;
  background:#fffaf0; color:#2d261b; padding:10px 12px; font:14px 'Inter',sans-serif;
}
.kb-btn{
  border:0; border-radius:9px; padding:10px 13px; cursor:pointer;
  font-weight:700; background:#cf9f4f; color:#241d14; transition:.15s;
}
.kb-btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.kb-btn.secondary{background:rgba(238,242,234,.12);color:#eef2ea;border:1px solid rgba(238,242,234,.2)}
.kb-btn.danger{background:#a8352a;color:#fff}
.kb-toolbar{display:flex;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid rgba(51,42,28,.12);flex-wrap:wrap}
.kb-stats{font-size:12px;color:#665b49;margin-left:auto}
.kb-board{
  flex:1; min-height:0; overflow:auto; padding:18px;
  display:grid; grid-template-columns:repeat(3,minmax(280px,1fr)); gap:16px;
  background:linear-gradient(135deg,#d8c8a5,#eee4ca);
}
.kb-column{
  min-height:300px; display:flex; flex-direction:column; border-radius:14px;
  background:rgba(255,250,240,.7); border:1px solid rgba(51,42,28,.12);
  box-shadow:0 8px 20px rgba(60,43,18,.12); overflow:hidden;
}
.kb-column-head{padding:13px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(51,42,28,.1)}
.kb-dot{width:10px;height:10px;border-radius:50%;background:#cf9f4f}
.kb-column:nth-child(2) .kb-dot{background:#2c4a7c}.kb-column:nth-child(3) .kb-dot{background:#2e6b4f}
.kb-column-head h3{margin:0;font-size:14px}.kb-count{margin-left:auto;font-size:11px;opacity:.6}
.kb-dropzone{padding:10px;flex:1;overflow:auto;min-height:220px;transition:.15s}
.kb-dropzone.drag-over{background:rgba(207,159,79,.15);outline:2px dashed #cf9f4f;outline-offset:-5px}
.kb-card{
  background:#fffaf0;border:1px solid rgba(51,42,28,.13);border-left:4px solid #cf9f4f;
  border-radius:11px;padding:12px;margin-bottom:9px;box-shadow:0 5px 12px rgba(0,0,0,.1);
  cursor:grab; user-select:none; transition:transform .15s,box-shadow .15s,opacity .15s;
}
.kb-card:hover{transform:translateY(-2px);box-shadow:0 9px 18px rgba(0,0,0,.14)}
.kb-card.dragging{opacity:.45;transform:rotate(1deg)}
.kb-card-title{font-weight:800;font-size:14px;margin-bottom:7px}
.kb-card-desc{font-size:12px;line-height:1.4;color:#6b604f;margin-bottom:9px}
.kb-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.kb-tag{font-size:10px;padding:4px 7px;border-radius:999px;background:#ead9ad}
.kb-date{font-size:10px;color:#6b604f;margin-left:auto}
.kb-card-actions{display:flex;gap:5px;margin-top:9px}
.kb-icon{border:1px solid rgba(51,42,28,.15);background:transparent;border-radius:6px;padding:5px 7px;cursor:pointer;font-size:11px}
.kb-empty{text-align:center;padding:35px 10px;color:#8c806b;font-size:12px}
.kb-modal{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);padding:18px;z-index:5;
}
.kb-modal.open{display:flex}
.kb-dialog{width:min(520px,100%);background:#efe4c4;border-radius:15px;padding:20px;box-shadow:0 25px 60px #0008}
.kb-dialog h2{margin:0 0 15px;font-size:20px}
.kb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kb-field{margin-bottom:10px}.kb-field.full{grid-column:1/-1}.kb-field label{color:#2c4a7c}
.kb-dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.kb-help{font-size:11px;color:#756954;padding:0 20px 12px}
@media(max-width:850px){
  #kanban-overlay{padding:8px}.kb-board{grid-template-columns:repeat(3,280px);overflow-x:auto}
  #kanban-app{height:100%}.kb-topbar{padding:12px}.kb-search{order:3;min-width:100%;max-width:none}
  #kanban-launcher{right:14px;bottom:14px}
}

</style>
</head>
<body>

<div class="stage">

  <div class="board-header">
    <div class="eyebrow">Conecte Escola · Portal Unificado</div>
    <h1>Boletim Digital & PDF</h1>
    <svg class="underline-svg" viewBox="0 0 220 14" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 9 C 40 2, 80 12, 120 6 S 190 3, 216 8" stroke="#eef2ea" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.8"/>
    </svg>
  </div>

  <!-- SELETOR GLOBAL DE PERFIS -->
  <div class="profile-selector">
    <button class="profile-btn active" onclick="trocarPerfil('aluno')">🎓 Aluno</button>
    <button class="profile-btn" onclick="trocarPerfil('pais')">👨‍👩‍👧 Responsáveis / Pais</button>
    <button class="profile-btn" onclick="trocarPerfil('professor')">👨‍🏫 Professor</button>
    <button class="profile-btn" onclick="trocarPerfil('diretor')">👔 Diretor</button>
  </div>

  <!-- ABAS DO ALUNO -->
  <div class="steps" id="steps-aluno">
    <div class="step-tab" data-step="aluno-login">1 · Login</div>
    <div class="step-tab" data-step="aluno-materia">2 · Matéria</div>
    <div class="step-tab" data-step="aluno-boletim">3 · Boletim</div>
  </div>

  <!-- ABAS DOS PAIS -->
  <div class="steps hidden" id="steps-pais">
    <div class="step-tab" data-step="pais-login">1 · Login dos Pais</div>
    <div class="step-tab" data-step="pais-busca">2 · Buscar Filho</div>
    <div class="step-tab" data-step="pais-boletim">3 · Boletim Escolar</div>
  </div>
  
  <!-- ABAS DO PROFESSOR -->
  <div class="steps hidden" id="steps-professor">
    <div class="step-tab" data-step="prof-login">1 · Login</div>
    <div class="step-tab" data-step="prof-alunos">2 · Alunos</div>
    <div class="step-tab" data-step="prof-materia">3 · Matéria</div>
    <div class="step-tab" data-step="prof-notas">4 · Lançar Notas</div>
    <div class="step-tab" data-step="prof-pdf">5 · Gerar PDF</div>
  </div>

  <!-- ABAS DO DIRETOR -->
  <div class="steps hidden" id="steps-diretor">
    <div class="step-tab" data-step="dir-login">1 · Acesso</div>
    <div class="step-tab" data-step="dir-turmas">2 · Turmas</div>
    <div class="step-tab" data-step="dir-boletim">3 · Ficha Geral</div>
    <div class="step-tab" data-step="dir-add-aluno">4 · Novo Aluno</div>
    <div class="step-tab" data-step="dir-edit-aluno">5 · Editar</div>
  </div>

  <div class="ficha">
    <svg class="clip" viewBox="0 0 34 52" xmlns="http://www.w3.org/2000/svg">
      <path d="M17 2 C27 2 30 10 30 17 L30 40 C30 47 24 50 17 50 C10 50 4 47 4 40 L4 15 C4 10 8 6 12 6 L12 38 C12 41 14 43 17 43 C20 43 22 41 22 38 L22 13" fill="none" stroke="#8a8a8a" stroke-width="3.4" stroke-linecap="round"/>
    </svg>
    <div class="furos"><span></span><span></span><span></span></div>

    <!-- ======================= -->
    <!-- 1. ÁREA DO ALUNO        -->
    <!-- ======================= -->
    <div class="panel" id="tela-aluno-login">
      <p class="saudacao">Acesso do Aluno</p>
      <p class="sub">Informe sua turma, nome, RA, dígito e senha para ver seu boletim.</p>

      <div class="campo">
        <label for="aluno-turma-select">Turma</label>
        <select id="aluno-turma-select">
          <option value="">Selecione sua turma...</option>
          <option value="6A">6º Ano A (6A)</option>
          <option value="6B">6º Ano B (6B)</option>
          <option value="7A">7º Ano A (7A)</option>
          <option value="7B">7º Ano B (7B)</option>
          <option value="8A">8º Ano A (8A)</option>
          <option value="8B">8º Ano B (8B)</option>
          <option value="9A">9º Ano A (9A)</option>
          <option value="9B">9º Ano B (9B)</option>
          <option value="1A">1º Ano E.M. A (1A)</option>
          <option value="1B">1º Ano E.M. B (1B)</option>
          <option value="1C">1º Ano E.M. C (1C)</option>
          <option value="2A">2º Ano E.M. A (2A)</option>
          <option value="2B">2º Ano E.M. B (2B)</option>
          <option value="3A-TECNICO">3º Ano Técnico (3A-TECNICO)</option>
          <option value="3B-REGULAR">3º Ano Regular (3B-REGULAR)</option>
        </select>
      </div>

      <div class="campo">
        <label for="aluno-nome">Nome Completo</label>
        <input type="text" id="aluno-nome" placeholder="Seu nome completo">
      </div>

      <div class="campo">
        <label>RA e Dígito</label>
        <div class="ra-group">
          <input type="text" id="aluno-ra" inputmode="numeric" maxlength="13" placeholder="RA (13 números)">
          <input type="text" id="aluno-digito" inputmode="numeric" maxlength="2" placeholder="Dígito">
        </div>
      </div>
      
      <div class="campo">
        <label for="aluno-senha">Senha</label>
        <input type="password" id="aluno-senha" autocomplete="off" placeholder="Digite sua senha">
      </div>

      <div class="erro" id="erro-aluno-login"></div>
      <button class="btn" type="button" id="btn-login-aluno">Entrar →</button>
    </div>

    <div class="panel hidden" id="tela-aluno-materia">
      <p class="saudacao">Aba de Matérias</p>
      <p class="sub">Selecione qual matéria deseja consultar as notas.</p>
      <div class="campo">
        <label for="aluno-materia-select">Matéria</label>
        <select id="aluno-materia-select">
          <option value="">Selecione...</option>
          <option value="Artes">Artes</option>
          <option value="Biologia">Biologia</option>
          <option value="Ciências">Ciências</option>
          <option value="Educação Física">Educação Física</option>
          <option value="Física">Física</option>
          <option value="Geografia">Geografia</option>
          <option value="História">História</option>
          <option value="Inglês">Inglês</option>
          <option value="Matemática">Matemática</option>
          <option value="Português">Português</option>
          <option value="Química">Química</option>
        </select>
      </div>
      <div class="erro" id="erro-aluno-materia"></div>
      <button class="btn" type="button" id="btn-ver-boletim-aluno">Ver Boletim →</button>
      <button class="btn btn-ghost" type="button" onclick="mostrarTela('aluno-login')">← Voltar Login</button>
    </div>

    <div class="panel hidden" id="tela-aluno-boletim">
      <p class="saudacao">Boletim do Aluno</p>
      <p class="resultado-nome" id="aluno-resultado-nome"></p>
      <p class="resultado-nome" id="aluno-resultado-materia" style="margin-top:-14px; font-size:18px; color:var(--pen-blue);"></p>
      <table class="boletim-table">
        <thead><tr><th>Bimestre</th><th class="num">Nota</th></tr></thead>
        <tbody id="aluno-boletim-corpo"></tbody>
        <tfoot><tr class="media"><td>Média final</td><td class="num" id="aluno-boletim-media"></td></tr></tfoot>
      </table>
      <div class="stamp-wrap"><div class="stamp" id="aluno-stamp-resultado"></div></div>
      <p class="resultado-texto" id="aluno-resultado-texto"></p>
      <button class="btn btn-ghost" type="button" onclick="mostrarTela('aluno-materia')">← Escolher outra matéria</button>
      <button class="btn btn-ghost" type="button" onclick="trocarPerfil('aluno')">Sair do Sistema</button>
    </div>

    <!-- ======================= -->
    <!-- 2. ÁREA DOS PAIS        -->
    <!-- ======================= -->
    <div class="panel hidden" id="tela-pais-login">
      <p class="saudacao">Área dos Pais & Responsáveis</p>
      <p class="sub">Cadastre-se ou faça login com seus dados e telefone de contato.</p>

      <div class="campo">
        <label for="pais-nome">Nome do Responsável</label>
        <input type="text" id="pais-nome" placeholder="Seu nome completo">
      </div>

      <div class="campo">
        <label for="pais-telefone">Número de Telefone / WhatsApp (Com DDD)</label>
        <input type="tel" id="pais-telefone" placeholder="(11) 99999-9999">
      </div>

      <div class="campo">
        <label for="pais-senha">Crie ou digite sua Senha</label>
        <input type="password" id="pais-senha" autocomplete="off" placeholder="Senha dos Pais">
      </div>

      <div class="erro" id="erro-pais-login"></div>
      <button class="btn" type="button" id="btn-login-pais" style="background-color: var(--pen-green);">Entrar no Portal da Família →</button>
    </div>

    <div class="panel hidden" id="tela-pais-busca">
      <p class="saudacao">Acesso dos Responsáveis</p>
      <p class="sub" id="pais-boas-vindas">Pesquise pelo seu filho no sistema para visualizar o boletim.</p>
      
      <div class="campo">
        <label for="pais-busca-input">Buscar Nome ou RA do Filho(a)</label>
        <div class="busca-box">
          <input type="text" id="pais-busca-input" placeholder="Digite o nome do aluno ou RA..." style="margin-bottom:0;">
          <button class="btn" type="button" id="btn-pais-buscar" style="width:100px; padding:10px; margin-top:0;">Buscar</button>
        </div>
      </div>

      <div class="tabela-scroll">
        <table class="boletim-table">
          <thead>
            <tr>
              <th>Turma</th>
              <th>Nome do Aluno</th>
              <th>RA</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="pais-filhos-corpo"></tbody>
        </table>
      </div>

      <button class="btn btn-ghost" type="button" onclick="trocarPerfil('pais')">← Sair do Portal dos Pais</button>
    </div>

    <div class="panel hidden" id="tela-pais-boletim">
      <p class="saudacao">Boletim Escolar do Filho</p>
      <p class="resultado-nome" id="pais-filho-nome"></p>
      <p class="sub" style="text-align:center; margin-top:-14px;">Média anual completa por matéria</p>

      <div class="tabela-scroll">
        <table class="boletim-table">
          <thead>
            <tr>
              <th>Matéria</th>
              <th class="num">1º B</th>
              <th class="num">2º B</th>
              <th class="num">3º B</th>
              <th class="num">4º B</th>
              <th class="num">Média</th>
            </tr>
          </thead>
          <tbody id="pais-boletim-corpo"></tbody>
        </table>
      </div>

      <a id="link-whatsapp-prof" target="_blank" style="text-decoration: none;">
        <button class="btn btn-green" type="button" style="margin-bottom:10px;">📱 Falar com a Escola / Professores</button>
      </a>

      <button class="btn btn-ghost" type="button" onclick="mostrarTela('pais-busca')">← Voltar para Busca de Alunos</button>
    </div>

    <!-- ======================= -->
    <!-- 3. ÁREA DO PROFESSOR    -->
    <!-- ======================= -->
    <div class="panel hidden" id="tela-prof-login">
      <p class="saudacao">Portal do Professor</p>
      <p class="sub">Acesso restrito para lançamento de notas e emissão de boletins.</p>
      <div class="campo">
        <label for="prof-nome">Nome do Professor</label>
        <input type="text" id="prof-nome" placeholder="Seu nome">
      </div>
      <div class="campo">
        <label for="prof-senha">Senha</label>
        <input type="password" id="prof-senha" autocomplete="off" placeholder="Senha do Professor">
      </div>
      <div class="erro" id="erro-prof-login"></div>
      <button class="btn" type="button" id="btn-login-prof">Entrar no Portal →</button>
    </div>

    <div class="panel hidden" id="tela-prof-alunos">
      <p class="saudacao">Alunos Cadastrados</p>
      <p class="sub" id="prof-boas-vindas"></p>
      <div class="tabela-scroll">
        <table class="boletim-table">
          <thead><tr><th>Nome</th><th>Turma</th><th>Ações</th></tr></thead>
          <tbody id="prof-alunos-corpo"></tbody>
        </table>
      </div>
      <button class="btn btn-ghost" type="button" onclick="trocarPerfil('professor')">← Sair</button>
    </div>

    <div class="panel hidden" id="tela-prof-materia">
      <p class="saudacao">Ações para o Aluno</p>
      <div class="aluno-selecionado-box">
        <p class="aluno-selecionado-texto" id="prof-aluno-selecionado-texto"></p>
      </div>

      <button class="btn btn-pdf" type="button" onclick="abrirOpcoesPDFProfessor()">📄 Gerar PDF de Notas/Boletim</button>
      <button class="btn" type="button" style="background:#a8352a;" onclick="abrirOcorrencias(estadoProf.alunoSelecionado, 'prof-materia')">📝 Ficha de Ocorrência</button>
      <button class="btn" type="button" style="background:#6b4a30;" onclick="abrirPedagogico(estadoProf.alunoSelecionado, 'prof-materia')">📘 Registro Pedagógico</button>
      <hr style="margin:20px 0; border:0; border-top:1px dashed var(--rule);">

      <p class="sub">Ou selecione uma matéria para lançar notas:</p>
      <div class="campo">
        <label for="prof-materia-select">Matéria</label>
        <select id="prof-materia-select">
          <option value="">Selecione...</option>
          <option value="Artes">Artes</option>
          <option value="Biologia">Biologia</option>
          <option value="Ciências">Ciências</option>
          <option value="Educação Física">Educação Física</option>
          <option value="Física">Física</option>
          <option value="Geografia">Geografia</option>
          <option value="História">História</option>
          <option value="Inglês">Inglês</option>
          <option value="Matemática">Matemática</option>
          <option value="Português">Português</option>
          <option value="Química">Química</option>
        </select>
      </div>
      <div class="erro" id="erro-prof-materia"></div>
      <button class="btn" type="button" id="btn-prof-materia-continuar">Lançar Notas →</button>
      <button class="btn btn-ghost" type="button" onclick="mostrarTela('prof-alunos')">← Voltar</button>
    </div>

    <div class="panel hidden" id="tela-prof-notas">
      <p class="saudacao">Lançamento de Notas</p>
      <p class="sub" id="prof-sub-notas"></p>
      <div class="grade-row"><label>1º Bimestre</label><input type="number" id="prof-nota1" min="0" max="10" step="0.1"></div>
      <div class="grade-row"><label>2º Bimestre</label><input type="number" id="prof-nota2" min="0" max="10" step="0.1"></div>
      <div class="grade-row"><label>3º Bimestre</label><input type="number" id="prof-nota3" min="0" max="10" step="0.1"></div>
      <div class="grade-row"><label>4º Bimestre</label><input type="number" id="prof-nota4" min="0" max="10" step="0.1"></div>
      <div class="erro" id="erro-prof-notas"></div>
      <div class="sucesso hidden" id="sucesso-prof-notas">Notas salvas com sucesso!</div>
      <button class="btn btn-green" type="button" id="btn-salvar-notas-prof">Salvar Notas</button>
      <button class="btn btn-ghost" type="button" onclick="mostrarTela('prof-materia')">← Voltar</button>
    </div>

    <!-- TELA PARA PROFESSOR CONFIGURAR E IMPRIMIR O PDF -->
    <div class="panel hidden" id="tela-prof-pdf">
      <p class="saudacao">Exportação em PDF</p>
      <p class="resultado-nome" id="pdf-prof-aluno-nome"></p>

      <div class="campo" style="margin: 15px 0;">
        <label for="select-tipo-pdf"><strong>Selecione o relatório a ser impresso:</strong></label>
        <select id="select-tipo-pdf" onchange="atualizarPreviewPDF()">
          <option value="TODOS">Boletim Completo (1º ao 4º Bimestre + Média Final)</option>
          <option value="0">Notas do 1º Bimestre</option>
          <option value="1">Notas do 2º Bimestre</option>
          <option value="2">Notas do 3º Bimestre</option>
          <option value="3">Notas do 4º Bimestre</option>
        </select>
      </div>

      <button class="btn btn-pdf" type="button" id="btn-gerar-pdf-prof" onclick="executarDownloadPDF()">📄 Baixar Arquivo PDF Agora</button>
      <button class="btn btn-ghost" type="button" onclick="mostrarTela('prof-materia')">← Voltar</button>

      <div style="margin-top:20px;">
        <p class="sub" style="margin-bottom:6px;">Pré-visualização do Relatório:</p>
        <div id="area-impressao-pdf">
          <div style="text-align:center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px;">
            <h3 style="margin:0; font-size:18px; color:#111;">CONECTE ESCOLA — BOLETIM OFICIAL</h3>
            <p style="margin:2px 0; font-size:12px; color:#555;">Documento Digital do Aluno</p>
          </div>

          <p style="margin:4px 0; font-size:13px; color:#111;"><strong>Aluno(a):</strong> <span id="pdf-preview-nome"></span></p>
          <p style="margin:4px 0; font-size:13px; color:#111;"><strong>RA:</strong> <span id="pdf-preview-ra"></span> | <strong>Turma:</strong> <span id="pdf-preview-turma"></span></p>

          <table class="boletim-table" id="tabela-pdf-preview" style="margin-top:15px; color:#000;">
            <!-- Gerado Dinamicamente -->
          </table>

          <div style="margin-top: 25px; text-align: right; font-size: 10px; color: #666; border-top: 1px solid #ddd; padding-top: 8px;">
            Relatório expedido digitalmente pelo corpo docente.
          </div>
        </div>
      </div>
    </div>

    <!-- ======================= -->
    <!-- 4. ÁREA DO DIRETOR      -->
    <!-- ======================= -->
    <div class="panel hidden" id="tela-dir-login">
      <p class="saudacao">Portal da Direção</p>
      <p class="sub">Acesso exclusivo para Gestão Escolar.</p>
      <div class="campo">
        <label for="dir-nome">Usuário Diretor</label>
        <input type="text" id="dir-nome" placeholder="Ex: Diretor">
      </div>
      <div class="campo">
        <label for="dir-senha">Senha da Direção</label>
        <input type="password" id="dir-senha" autocomplete="off" placeholder="Digite a senha">
      </div>
      <div class="erro" id="erro-dir-login"></div>
      <button class="btn" style="background-color: var(--pen-red);" type="button" id="btn-login-dir">Acessar Sistema →</button>
    </div>

    <div class="panel hidden" id="tela-dir-turmas">
      <p class="saudacao">Gestão de Turmas</p>
      <p class="sub" id="dir-boas-vindas">Selecione uma turma.</p>
      
      <div class="campo" style="margin-bottom: 16px;">
        <label for="dir-turma-select">Filtro de Turma</label>
        <select id="dir-turma-select">
          <option value="TODAS">--- Todas as Turmas ---</option>
          <option value="6A">6º Ano A (6A)</option>
          <option value="6B">6º Ano B (6B)</option>
          <option value="7A">7º Ano A (7A)</option>
          <option value="7B">7º Ano B (7B)</option>
          <option value="8A">8º Ano A (8A)</option>
          <option value="8B">8º Ano B (8B)</option>
          <option value="9A">9º Ano A (9A)</option>
          <option value="9B">9º Ano B (9B)</option>
          <option value="1A">1º Ano E.M. A (1A)</option>
          <option value="1B">1º Ano E.M. B (1B)</option>
          <option value="1C">1º Ano E.M. C (1C)</option>

<script>
  // SENHAS DO SISTEMA
  const SENHA_ALUNO = "@Josetalarico1";
  const SENHA_PROFESSOR = "@Professor2026";
  const SENHA_DIRETOR = "@Diretor2026"; 

  const LISTA_MATERIAS = ["Artes", "Biologia", "Ciências", "Educação Física", "Física", "Geografia", "História", "Inglês", "Matemática", "Português", "Química"];

  function resetarBanco() {
      if(confirm("Tem certeza que deseja resetar todo o banco de dados para a configuração padrão?")) {
          localStorage.removeItem('banco_usuarios');
          inicializarBanco();
          alert("Banco de dados resetado com sucesso!");
          location.reload();
      }
  }

  function inicializarBanco() {
    let banco = localStorage.getItem('banco_usuarios');
    if (!banco) {
      const ALUNOS_DB_INICIAL = [
        {
          nome:"Ana Clara Silva",ra:"1000202400011",digito:"1",turma:"6A",
          materias: {
            "Matemática": [8.5, 7.0, 9.0, 8.0],
            "Português": [6.0, 8.0, 7.5, 9.0],
            "História": [9.0, 9.5, 8.0, 10.0]
          }
        },
        {nome:"Arthur Santos Lima",ra:"1000202400012",digito:"2",turma:"6A",materias:{}},
        {nome:"João Pedro Carvalho",ra:"1000202400021",digito:"1",turma:"6B",materias:{}},
        {nome:"Alice Monteiro",ra:"1000202400031",digito:"1",turma:"7A",materias:{}},
        {nome:"Miguel Ângelo",ra:"1000202400041",digito:"1",turma:"7B",materias:{}},
        {nome:"André Luiz Soares",ra:"1000202400051",digito:"1",turma:"8A",materias:{}},
        {nome:"Kauan Felipe",ra:"1000202400061",digito:"1",turma:"8B",materias:{}},
        {nome:"Alan Kardec",ra:"1000202400071",digito:"1",turma:"9A",materias:{}},
        {nome:"Marcos Paulo",ra:"1000202400081",digito:"1",turma:"9B",materias:{}},
        {nome:"Alice Paulino",ra:"1000202400091",digito:"1",turma:"1A",materias:{}},
        {nome:"Karen Junqueira",ra:"1000202400101",digito:"1",turma:"1B",materias:{}},
        {nome:"Ulisses Campbell",ra:"1000202400111",digito:"1",turma:"1C",materias:{}},
        {nome:"Elaine Mickely",ra:"1000202400121",digito:"1",turma:"2A",materias:{}},
        {nome:"Otaviano Costa",ra:"1000202400131",digito:"1",turma:"2B",materias:{}},
        {nome:"Alexandre Frota",ra:"1000202400141",digito:"1",turma:"3A-TECNICO",materias:{}},
        {nome:"Klebber Toledo",ra:"1000202400151",digito:"1",turma:"3B-REGULAR",materias:{}}
      ];
      localStorage.setItem('banco_usuarios', JSON.stringify(ALUNOS_DB_INICIAL));
    }
  }
  inicializarBanco();

  function obterBancoUsuarios() {
    return JSON.parse(localStorage.getItem('banco_usuarios')) || [];
  }

  // ESTADOS GLOBAIS DE SESSÃO
  const estadoAluno = { nome:"", ra:"", digito:"", turma:"", materia:"", notas:[] };
  const estadoPais = { nome:"", telefone:"", filhoSelecionado: null };
  const estadoProf = { nome:"", alunoSelecionado: null, materiaSelecionada: "" };
  const estadoDir = { nome:"", alunoSelecionado: null };

  const telas = {
    'aluno-login': document.getElementById('tela-aluno-login'),
    'aluno-materia': document.getElementById('tela-aluno-materia'),
    'aluno-boletim': document.getElementById('tela-aluno-boletim'),
    
    'pais-login': document.getElementById('tela-pais-login'),
    'pais-busca': document.getElementById('tela-pais-busca'),
    'pais-boletim': document.getElementById('tela-pais-boletim'),

    'prof-login': document.getElementById('tela-prof-login'),
    'prof-alunos': document.getElementById('tela-prof-alunos'),
    'prof-materia': document.getElementById('tela-prof-materia'),
    'prof-notas': document.getElementById('tela-prof-notas'),
    'prof-pdf': document.getElementById('tela-prof-pdf'),

    'dir-login': document.getElementById('tela-dir-login'),
    'dir-turmas': document.getElementById('tela-dir-turmas'),
    'dir-boletim': document.getElementById('tela-dir-boletim'),
    'dir-add-aluno': document.getElementById('tela-dir-add-aluno'),
    'dir-edit-aluno': document.getElementById('tela-dir-edit-aluno'),

    'ficha-ocorrencia': document.getElementById('tela-ficha-ocorrencia'),
    'ficha-pedagogico': document.getElementById('tela-ficha-pedagogico')
  };

  const ordemEtapas = {
    'aluno': ['aluno-login', 'aluno-materia', 'aluno-boletim'],
    'pais': ['pais-login', 'pais-busca', 'pais-boletim'],
    'prof': ['prof-login', 'prof-alunos', 'prof-materia', 'prof-notas', 'prof-pdf'],
    'dir': ['dir-login', 'dir-turmas', 'dir-boletim', 'dir-add-aluno', 'dir-edit-aluno']
  };

  let perfilAtual = 'aluno';

  function trocarPerfil(perfil) {
    perfilAtual = perfil;
    document.querySelectorAll('.profile-btn').forEach(btn => btn.classList.remove('active'));
    
    if(perfil === 'aluno') {
      document.querySelectorAll('.profile-btn')[0].classList.add('active');
      mostrarTela('aluno-login');
    } else if(perfil === 'pais') {
      document.querySelectorAll('.profile-btn')[1].classList.add('active');
      mostrarTela('pais-login');
    } else if(perfil === 'professor') {
      document.querySelectorAll('.profile-btn')[2].classList.add('active');
      mostrarTela('prof-login');
    } else if(perfil === 'diretor') {
      document.querySelectorAll('.profile-btn')[3].classList.add('active');
      mostrarTela('dir-login');
    }
  }

  function mostrarTela(nomeTela){
    Object.values(telas).forEach(t => t.classList.add('hidden'));
    if(telas[nomeTela]) telas[nomeTela].classList.remove('hidden');

    document.getElementById('steps-aluno').classList.toggle('hidden', perfilAtual !== 'aluno');
    document.getElementById('steps-pais').classList.toggle('hidden', perfilAtual !== 'pais');
    document.getElementById('steps-professor').classList.toggle('hidden', perfilAtual !== 'professor');
    document.getElementById('steps-diretor').classList.toggle('hidden', perfilAtual !== 'diretor');

    const moduloKey = perfilAtual === 'professor' ? 'prof' : (perfilAtual === 'diretor' ? 'dir' : perfilAtual);
    const etapasModulo = ordemEtapas[moduloKey] || [];
    const containerSteps = document.getElementById(`steps-${perfilAtual === 'professor' ? 'professor' : (perfilAtual === 'diretor' ? 'diretor' : perfilAtual)}`);

    if(containerSteps) {
      const tabs = containerSteps.querySelectorAll('.step-tab');
      const idxAtual = etapasModulo.indexOf(nomeTela);
      tabs.forEach(tab => {
        const idxTab = etapasModulo.indexOf(tab.dataset.step);
        tab.classList.toggle('active', idxTab === idxAtual);
        tab.classList.toggle('done', idxTab < idxAtual);
      });
    }
  }

  // ==========================================
  // 1. LÓGICA DO ALUNO
  // ==========================================
  document.getElementById('btn-login-aluno').addEventListener('click', () => {
    const turma = document.getElementById('aluno-turma-select').value;
    const nome = document.getElementById('aluno-nome').value.trim();
    const ra = document.getElementById('aluno-ra').value.trim();
    const digito = document.getElementById('aluno-digito').value.trim();
    const senha = document.getElementById('aluno-senha').value;
    const erro = document.getElementById('erro-aluno-login');
    erro.textContent = "";

    if(!turma){ erro.textContent = "Selecione sua turma."; return; }
    if(!nome){ erro.textContent = "Digite seu nome completo."; return; }
    if(!ra || !digito){ erro.textContent = "Informe o RA e o dígito."; return; }

    const banco = obterBancoUsuarios();
    const aluno = banco.find(u => u.ra === ra && u.digito === digito);

    if(!aluno){ erro.textContent = "Aluno não encontrado. Verifique o RA e dígito."; return; }
    if(aluno.turma !== turma){ erro.textContent = `Acesso negado! Este aluno pertence à turma ${aluno.turma}.`; return; }
    if(senha !== SENHA_ALUNO){ erro.textContent = "Senha incorreta."; return; }

    estadoAluno.nome = aluno.nome;
    estadoAluno.ra = ra;
    estadoAluno.digito = digito;
    estadoAluno.turma = aluno.turma;

    mostrarTela('aluno-materia');
  });

  document.getElementById('btn-ver-boletim-aluno').addEventListener('click', () => {
    const materia = document.getElementById('aluno-materia-select').value;
    const erro = document.getElementById('erro-aluno-materia');
    erro.textContent = "";

    if(!materia){ erro.textContent = "Selecione uma matéria."; return; }

    const banco = obterBancoUsuarios();
    const aluno = banco.find(u => u.ra === estadoAluno.ra);

    if(!aluno || !aluno.materias || !aluno.materias[materia]) {
        erro.textContent = "Notas ainda não lançadas para essa matéria."; return;
    }

    estadoAluno.materia = materia;

  function atualizarPreviewPDF() {
    const aluno = estadoProf.alunoSelecionado;
    if (!aluno) return;

    const tipo = document.getElementById('select-tipo-pdf').value;
    const tabela = document.getElementById('tabela-pdf-preview');
    let html = "";

    if (tipo === "TODOS") {
      html = `
        <thead>
          <tr>
            <th>Matéria</th>
            <th class="num">1º B</th>
            <th class="num">2º B</th>
            <th class="num">3º B</th>
            <th class="num">4º B</th>
            <th class="num">Média</th>
          </tr>
        </thead>
        <tbody>
      `;

      LISTA_MATERIAS.forEach(mat => {
        const notas = (aluno.materias && aluno.materias[mat]) ? aluno.materias[mat] : [];
        
        const n1 = (notas[0] !== undefined && notas[0] !== null) ? notas[0].toFixed(1) : "N/A";
        const n2 = (notas[1] !== undefined && notas[1] !== null) ? notas[1].toFixed(1) : "N/A";
        const n3 = (notas[2] !== undefined && notas[2] !== null) ? notas[2].toFixed(1) : "N/A";
        const n4 = (notas[3] !== undefined && notas[3] !== null) ? notas[3].toFixed(1) : "N/A";

        const notasValidas = notas.filter(n => n !== undefined && n !== null);
        let media = "N/A";
        if (notasValidas.length > 0) {
          media = (notasValidas.reduce((a, b) => a + b, 0) / notasValidas.length).toFixed(1);
        }

        html += `
          <tr>
            <td style="font-weight: 500;">${mat}</td>
            <td class="num">${n1}</td>
            <td class="num">${n2}</td>
            <td class="num">${n3}</td>
            <td class="num">${n4}</td>
            <td class="num" style="font-weight:bold;">${media}</td>
          </tr>
        `;
      });

    } else {
      const bimIndex = parseInt(tipo);
      const nomesBimestres = ["1º Bimestre", "2º Bimestre", "3º Bimestre", "4º Bimestre"];

      html = `
        <thead>
          <tr>
            <th>Matéria</th>
            <th class="num">Nota (${nomesBimestres[bimIndex]})</th>
          </tr>
        </thead>
        <tbody>
      `;

      LISTA_MATERIAS.forEach(mat => {
        const notas = (aluno.materias && aluno.materias[mat]) ? aluno.materias[mat] : [];
        const notaBimestre = (notas[bimIndex] !== undefined && notas[bimIndex] !== null) 
          ? notas[bimIndex].toFixed(1) 
          : "N/A";

        html += `
          <tr>
            <td style="font-weight: 500;">${mat}</td>
            <td class="num" style="font-weight:bold;">${notaBimestre}</td>
          </tr>
        `;
      });
    }

    html += `</tbody>`;
    tabela.innerHTML = html;
  }

  function executarDownloadPDF() {
    const elemento = document.getElementById('area-impressao-pdf');
    const aluno = estadoProf.alunoSelecionado;

    // Criar um container temporário fora da tela com largura fixa A4 para evitar cortes de layout/overflow
    const clone = elemento.cloneNode(true);
    clone.style.width = '700px';
    clone.style.padding = '20px';
    clone.style.background = '#ffffff';
    clone.style.color = '#000000';
    clone.style.boxSizing = 'border-box';

    const containerTemp = document.createElement('div');
    containerTemp.style.position = 'absolute';
    containerTemp.style.left = '-9999px';
    containerTemp.style.top = '0';
    containerTemp.style.width = '750px';
    containerTemp.appendChild(clone);
    document.body.appendChild(containerTemp);

    const configuracoes = {
      margin:       [10, 10, 10, 10],
      filename:     `Boletim_${aluno ? aluno.nome.replace(/\s+/g, '_') : 'Aluno'}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, windowWidth: 800 },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
    };

    html2pdf().set(configuracoes).from(clone).save().then(() => {
      document.body.removeChild(containerTemp);
    }).catch(err => {
      console.error(err);
      if(document.body.contains(containerTemp)) document.body.removeChild(containerTemp);
    });
  }

  // ---------- PDF GENÉRICO PARA FICHAS ----------
  function baixarFichaGenericaPDF(titulo, aluno, registros, colunas){
    if(!aluno) return;
    const wrapper = document.createElement('div');
    wrapper.style.position = 'absolute';
    wrapper.style.left = '-9999px';
    wrapper.style.top = '0';
    wrapper.style.width = '750px';

    const corpoRegistros = (!registros || registros.length === 0)
      ? '<p style="margin-top:16px; font-size:13px; color:#555;">Nenhum registro encontrado.</p>'
      : [...registros].reverse().map(r => `
          <div style="border:1px solid #ccc; border-radius:6px; padding:10px 12px; margin-top:10px;">
            ${colunas.map(c => `<p style="margin:3px 0; font-size:12px; color:#111;"><strong>${c.label}:</strong> ${r[c.key] || '-'}</p>`).join('')}
          </div>
        `).join('');

    wrapper.innerHTML = `
      <div style="width:700px; padding:20px; background:#ffffff; color:#000000; font-family:'Inter',sans-serif; box-sizing:border-box;">
        <div style="text-align:center; border-bottom:2px solid #333; padding-bottom:10px; margin-bottom:15px;">
          <h3 style="margin:0; font-size:18px; color:#111;">CONECTE ESCOLA — ${titulo.toUpperCase()}</h3>
          <p style="margin:2px 0; font-size:12px; color:#555;">Documento Digital do Aluno</p>
        </div>
        <p style="margin:4px 0; font-size:13px; color:#111;"><strong>Aluno(a):</strong> ${aluno.nome}</p>
        <p style="margin:4px 0; font-size:13px; color:#111;"><strong>RA:</strong> ${aluno.ra}-${aluno.digito || '0'} | <strong>Turma:</strong> ${aluno.turma || 'Sem Turma'}</p>
        ${corpoRegistros}
      </div>
    `;
    document.body.appendChild(wrapper);

    const configuracoes = {
      margin: [10,10,10,10],
      filename: `${titulo.replace(/\s+/g,'_')}_${aluno.nome.replace(/\s+/g,'_')}.pdf`,
      image: { type:'jpeg', quality:0.98 },
      html2canvas: { scale:2, useCORS:true, scrollX:0, scrollY:0, windowWidth:800 },
      jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
      pagebreak: { mode:['avoid-all','css','legacy'] }
    };

    html2pdf().set(configuracoes).from(wrapper.firstElementChild).save().then(() => {
      document.body.removeChild(wrapper);
    }).catch(err => {
      console.error(err);
      if(document.body.contains(wrapper)) document.body.removeChild(wrapper);
    });
  }

/* ===== KANBAN INTERATIVO ===== */
const KB = (() => {
  const KEY='conect_escola_kanban_v1';
  let editId=null, filter='all', draggedId=null;
  const seed=[
    {id:crypto.randomUUID(),title:'Revisar conteúdo da próxima prova',desc:'Separe 30 minutos para revisar os pontos principais.',status:'todo',priority:'high',tag:'Estudos',due:''},
    {id:crypto.randomUUID(),title:'Fazer atividade de matemática',desc:'Resolver os exercícios pendentes.',status:'doing',priority:'medium',tag:'Matemática',due:''},
    {id:crypto.randomUUID(),title:'Entregar trabalho',desc:'Trabalho finalizado e pronto para entrega.',status:'done',priority:'low',tag:'Projeto',due:''}
  ];
  function get(){try{return JSON.parse(localStorage.getItem(KEY))||seed}catch(e){return seed}}
  function saveAll(a){localStorage.setItem(KEY,JSON.stringify(a))}
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
  function priorityLabel(p){return p==='high'?'🔥 Alta':p==='low'?'Baixa':'Média'}
  function matches(c){
    const q=document.getElementById('kb-search').value.trim().toLowerCase();
    if(q && !(`${c.title} ${c.desc} ${c.tag}`.toLowerCase().includes(q))) return false;
    if(filter==='today' && c.due!==new Date().toISOString().slice(0,10)) return false;
    if(filter==='high' && c.priority!=='high') return false;
    return true;
  }
  function card(c){
    const el=document.createElement('article'); el.className='kb-card'; el.draggable=true; el.dataset.id=c.id;
    const due=c.due?new Date(c.due+'T00:00:00').toLocaleDateString('pt-BR'):'';
    const border=c.priority==='high'?'#a8352a':c.priority==='medium'?'#cf9f4f':'#2e6b4f';
    el.style.borderLeftColor=border;
    el.innerHTML=`<div class="kb-card-title">${esc(c.title)}</div>
      ${c.desc?`<div class="kb-card-desc">${esc(c.desc)}</div>`:''}
      <div class="kb-meta"><span class="kb-tag">${esc(c.tag||'Geral')}</span><span class="kb-tag">${priorityLabel(c.priority)}</span>${due?`<span class="kb-date">📅 ${due}</span>`:''}</div>
      <div class="kb-card-actions"><button class="kb-icon" data-action="edit">✏️ Editar</button><button class="kb-icon" data-action="delete">🗑️</button></div>`;
    el.addEventListener('dragstart',e=>{draggedId=c.id;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',c.id)});
    el.addEventListener('dragend',()=>{draggedId=null;el.classList.remove('dragging');document.querySelectorAll('.kb-dropzone').forEach(x=>x.classList.remove('drag-over'))});
    el.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(!a)return;e.stopPropagation();if(a.dataset.action==='edit')edit(c.id);else remove(c.id)});
    return el;
  }
  function render(){
    const data=get();
    document.querySelectorAll('.kb-dropzone').forEach(z=>z.innerHTML='');
    const counts={todo:0,doing:0,done:0};
    data.forEach(c=>{counts[c.status]++;if(matches(c)){document.querySelector(`[data-status="${c.status}"]`).appendChild(card(c))}});
    Object.entries(counts).forEach(([k,v])=>document.getElementById('kb-count-'+k).textContent=v);
    document.getElementById('kb-stats').textContent=`${data.length} tarefa${data.length!==1?'s':''} • ${counts.done} concluída${counts.done!==1?'s':''}`;
  }
  function open(){document.getElementById('kanban-overlay').classList.add('open');document.getElementById('kanban-overlay').setAttribute('aria-hidden','false');render()}
  function close(){document.getElementById('kanban-overlay').classList.remove('open');document.getElementById('kanban-overlay').setAttribute('aria-hidden','true');closeModal()}
  function newCard(){editId=null;document.getElementById('kb-modal-title').textContent='Nova tarefa';['kb-title','kb-desc','kb-tag','kb-due'].forEach(id=>document.getElementById(id).value='');document.getElementById('kb-status').value='todo';document.getElementById('kb-priority').value='medium';document.getElementById('kb-modal').classList.add('open');setTimeout(()=>document.getElementById('kb-title').focus(),50)}
  function edit(id){const c=get().find(x=>x.id===id);if(!c)return;editId=id;document.getElementById('kb-modal-title').textContent='Editar tarefa';document.getElementById('kb-title').value=c.title;document.getElementById('kb-desc').value=c.desc||'';document.getElementById('kb-status').value=c.status;document.getElementById('kb-priority').value=c.priority||'medium';document.getElementById('kb-tag').value=c.tag||'';document.getElementById('kb-due').value=c.due||'';document.getElementById('kb-modal').classList.add('open')}
  function closeModal(){document.getElementById('kb-modal').classList.remove('open')}
  function save(e){e.preventDefault();const a=get();const obj={id:editId||crypto.randomUUID(),title:document.getElementById('kb-title').value.trim(),desc:document.getElementById('kb-desc').value.trim(),status:document.getElementById('kb-status').value,priority:document.getElementById('kb-priority').value,tag:document.getElementById('kb-tag').value.trim()||'Geral',due:document.getElementById('kb-due').value};const i=a.findIndex(x=>x.id===editId);if(i>=0)a[i]=obj;else a.unshift(obj);saveAll(a);closeModal();render()}
  function remove(id){const c=get().find(x=>x.id===id);if(c&&confirm(`Excluir "${c.title}"?`)){saveAll(get().filter(x=>x.id!==id));render()}}
  function setFilter(f){filter=f;render()}
  function clearDone(){if(confirm('Excluir todas as tarefas concluídas?')){saveAll(get().filter(c=>c.status!=='done'));render()}}
  document.querySelectorAll('.kb-dropzone').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('drag-over')});
    z.addEventListener('dragleave',()=>z.classList.remove('drag-over'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain')||draggedId;const a=get();const c=a.find(x=>x.id===id);if(c){c.status=z.dataset.status;saveAll(a);render()}});
  });
  document.getElementById('kanban-overlay').addEventListener('click',e=>{if(e.target.id==='kanban-overlay')close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  return {open,close,newCard,edit,save,closeModal,render,setFilter,clearDone};
})();

</script>

  }
  .furos span{
    width:14px; height:14px;
    border-radius:50%;
    background: var(--board-dark);
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.5);
  }

  .panel{
    padding:34px 34px 34px 78px;
    position:relative;
    z-index:5;
  }

  label{
    display:block;
    font-family:'Special Elite', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    color:var(--pen-blue);
    margin-bottom:5px;
  }
  input[type="text"], input[type="password"], input[type="number"], input[type="tel"], select{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:10px 12px;
    border:1.5px solid rgba(51,42,28,0.25);
    border-radius:6px;
    background:#fbf7ea;
    color:var(--ink);
    margin-bottom:6px;
    position:relative;
    z-index:20;
    pointer-events:auto !important;
  }
  input:focus, select:focus{ outline:2px solid var(--pen-blue); outline-offset:1px; }
  
  .ra-group {
    display: grid;
    grid-template-columns: 1fr 70px;
    gap: 10px;
  }

  .campo{ margin-bottom:6px; }

  .erro{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:20px;
    color:var(--pen-red);
    min-height:24px;
    margin: 4px 0 10px;
    transform: rotate(-0.5deg);
  }
  
  .sucesso{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:22px;
    color:var(--pen-green);
    min-height:24px;
    margin: 4px 0 10px;
  }

  .btn{
    font-family:'Special Elite', monospace;
    letter-spacing:0.06em;
    font-size:14px;
    padding:12px 18px;
    width:100%;
    border:none;
    border-radius:6px;
    background: var(--pen-blue);
    color:var(--chalk);
    cursor:pointer;
    transition: transform .12s ease, background .2s ease;
    position:relative;
    z-index:20;
    margin-top: 5px;
  }
  .btn:hover{ background:#233d68; transform:translateY(-1px); }
  .btn:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  .btn-ghost{
    background:transparent;
    color:var(--pen-blue);
    border:1.5px solid var(--pen-blue);
    margin-top:10px;
  }
  .btn-ghost:hover{ background:rgba(44,74,124,0.08); }
  
  .btn-green { background: var(--pen-green); }
  .btn-green:hover { background: #23543d; }

  .btn-pdf { background: #8a3b14; color: #fff; }
  .btn-pdf:hover { background: #6e2e0f; }

  .tabela-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top: 10px; }

  .acoes-cell{ display:flex; gap:6px; flex-wrap:wrap; }

  .btn-selecionar, .btn-excluir, .btn-editar{
    font-family:'Special Elite', monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:5px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .btn-selecionar{ border:1.5px solid var(--pen-blue); background:transparent; color:var(--pen-blue); }
  .btn-selecionar:hover{ background:var(--pen-blue); color:var(--chalk); }

  .btn-excluir{ border:1.5px solid var(--pen-red); background:transparent; color:var(--pen-red); }
  .btn-excluir:hover{ background:var(--pen-red); color:var(--chalk); }

  .btn-editar{ border:1.5px solid #8a6318; background:transparent; color:#8a6318; }
  .btn-editar:hover{ background:var(--gold); color:var(--ink); }

  .vazio-tabela{ text-align:center; color:rgba(51,42,28,0.55); font-style:italic; padding: 20px 0; }

  .aluno-selecionado-box{
    background:#fbf7ea;
    border:1.5px dashed var(--pen-blue);
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:18px;
  }
  .aluno-selecionado-texto{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:20px;
    color:var(--pen-blue);
    margin:0;
  }

  .saudacao{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:30px;
    margin:0 0 2px;
    color:var(--ink);
  }
  .sub{
    font-size:13px;
    color:rgba(51,42,28,0.6);
    margin:0 0 18px;
  }

  .grade-row{
    display:grid; grid-template-columns: 1fr 96px;
    align-items:center; gap:14px; margin-bottom:10px;
  }
  .grade-row label{ margin-bottom:0; }
  .grade-row input{ margin-bottom:0; text-align:center; font-family:'Special Elite', monospace; }

  .boletim-table{
    width:100%; border-collapse:collapse;
    margin: 12px 0 20px; font-family:'Special Elite', monospace; font-size:13px;
  }
  .boletim-table th, .boletim-table td{
    text-align:left; padding:8px 6px; border-bottom:1px dashed rgba(51,42,28,0.3);
  }
  .boletim-table th{ color: var(--pen-blue); font-weight:400; letter-spacing:0.04em; }
  .boletim-table td.num{ text-align:right; }
  .boletim-table tr.media td{
    border-bottom:none; border-top:2px solid var(--ink); font-weight:700; color:var(--pen-red);
  }

  .stamp-wrap{ position:relative; display:flex; justify-content:center; margin: 6px 0 16px; }
  .stamp{
    font-family:'Special Elite', monospace; font-size:24px; letter-spacing:0.1em;
    padding:10px 22px; border:4px double currentColor; border-radius:8px;
    transform:rotate(-6deg); text-transform:uppercase; opacity:0.92; mix-blend-mode:multiply;
  }
  .stamp.ok{ color:var(--pen-green); }
  .stamp.rec{ color:var(--pen-red); }

  .resultado-texto{ text-align:center; line-height:1.5; margin-bottom:6px; }
  .resultado-nome{
    text-align:center; font-family:'Caveat', cursive; font-size:22px;
    color:rgba(51,42,28,0.65); margin: -6px 0 14px;
  }

  .busca-box {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  /* ESTRUTURA PARA FORMATAÇÃO DO PDF */
  #area-impressao-pdf {
    background: #ffffff;
    color: #000000;
    padding: 24px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    width: 100%;
    box-sizing: border-box;
    overflow: visible;
  }
  #area-impressao-pdf table {
    width: 100%;
    border-collapse: collapse;
  }

  .hidden{ display:none !important; }

  .clip{
    position:absolute; top:-14px; right:36px; width:34px; height:52px; z-index:4;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.35)); pointer-events:none;
  }

  footer.credit{
    text-align:center; margin-top:22px; font-family:'Special Elite', monospace;
    font-size:11px; letter-spacing:0.08em; color: var(--chalk-dim);
  }
  
  .reset-link {
      color: var(--chalk-dim);
      text-decoration: underline;
      cursor: pointer;
      margin-top: 10px;
      display: inline-block;
  }
  .reset-link:hover { color: var(--chalk); }

  @media (max-width:480px){
    .panel{ padding:30px 18px 30px 58px; }
    .ficha::before{ left:38px; }
    .furos{ left:12px; }
    .acoes-cell { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="board-header">
    <div class="eyebrow">Conecte Escola · Portal Unificado</div>
    <h1>TUTORIA</h1>
    <svg class="underline-svg" viewBox="0 0 220 14" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 9 C 40 2, 80 12, 120 6 S 190 3, 216 8" stroke="#eef2ea" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.8"/>
    </svg>
  </div>

  <!-- SELETOR GLOBAL DE PERFIS UNIFICADO -->
  <div class="profile-selector">
    <button class="profile-btn active" onclick="trocarPerfil('aluno')">🎓 Aluno</button>
    <button class="profile-btn" onclick="trocarPerfil('pais')">👨‍👩‍👧 Responsáveis / Pais</button>
    <button class="profile-btn" onclick="trocarPerfil('professor')">👨‍🏫 Professor & 📋 Tutoria</button>
  </div>

  <!-- ABAS DO ALUNO -->
  <div class="steps" id="steps-aluno">
    <div class="step-tab" data-step="aluno-login">1 · Login</div>
    <div class="step-tab" data-step="aluno-materia">2 · Matéria</div>
    <div class="step-tab" data-step="aluno-boletim">3 · Boletim</div>
  </div>

  <!-- ABAS DOS PAIS -->
  <div class="steps hidden" id="steps-pais">
    <div class="step-tab" data-step="pais-login">1 · Login dos Pais</div>
    <div class="step-tab" data-step="pais-busca">2 · Meus Filhos</div>
    <div class="step-tab" data-step="pais-boletim">3 · Boletim Escolar</div>
  </div>
  
  <!-- ABAS DO PROFESSOR E TUTORIA UNIFICADAS -->
  <div class="steps hidden" id="steps-professor">
    <div class="step-tab" data-step="prof-login">1 · Login</div>
    <div class="step-tab" data-step="prof-alunos">2 · Alunos (Prof.)</div>
    <div class="step-tab" data-step="dir-turmas">3 · Gestão/Turmas (Tutoria)</div>
    <div class="step-tab" data-step="prof-materia">4 · Matéria</div>
    <div class="step-tab" data-step="prof-notas">5 · Lançar Notas</div>
    <div class="step-tab" data-step="prof-pdf">6 · Gerar PDF</div>
  </div>

  <!-- ABAS DA TUTORIA (mantidas para compatibilidade interna) -->
  <div class="steps hidden" id="steps-tutoria">
    <div class="step-tab" data-step="dir-login">1 · Acesso</div>
    <div class="step-tab" data-step="dir-turmas">2 · Turmas</div>
    <div class="step-tab" data-step="dir-boletim">3 · Ficha Geral</div>
    <div class="step-tab" data-step="dir-add-aluno">4 · Novo Aluno</div>
    <div class="step-tab" data-step="dir-edit-aluno">5 · Editar</div>
  </div>

  <div class="ficha">
    <svg class="clip" viewBox="0 0 34 52" xmlns="http://www.w3.org/2000/svg">
      <path d="M17 2 C27 2 30 10 30 17 L30 40 C30 47 24 50 17 50 C10 50 4 47 4 40 L4 15 C4 10 8 6 12 6 L12 38 C12 41 14 43 17 43 C20 43 22 41 22 38 L22 13" fill="none" stroke="#8a8a8a" stroke-width="3.4" stroke-linecap="round"/>
    </svg>
    <div class="furos"><span></span><span></span><span></span></div>

    <!-- ======================= -->
    <!-- 1. ÁREA DO ALUNO        -->
    <!-- ======================= -->
    <div class="panel" id="tela-aluno-login">
      <p class="saudacao">Acesso do Aluno</p>
      <p class="sub">Informe sua turma, nome, RA, dígito e senha para ver seu boletim.</p>

      <div class="campo">
        <label for="aluno-turma-select">Turma</label>
        <select id="aluno-turma-select">
          <option value="">Selecione sua turma...</option>
          <option value="6A">6º Ano A (6A)</option>
          <option value="6B">6º Ano B (6B)</option>
          <option value="7A">7º Ano A (7A)</option>
          <option value="7B">7º Ano B (7B)</option>
          <option value="8A">8º Ano A (8A)</option>
          <option value="8B">8º Ano B (8B)</option>
          <option value="9A">9º Ano A (9A)</option>
          <option value="9B">9º Ano B (9B)</option>
          <option value="1A">1º Ano E.M. A (1A)</option>
          <option value="1B">1º Ano E.M. B (1B)</option>
          <option value="1C">1º Ano E.M. C (1C)</option>
          <option value="2A">2º Ano E.M. A (2A)</option>
          <option value="2B">2º Ano E.M. B (2B)</option>
          <option value="3A-TECNICO">3º Ano Técnico (3A-TECNICO)</option>
          <option value="3B-REGULAR">3º Ano Regular (3B-REGULAR)</option>
        </select>
      </div>

      <div class="campo">
        <label for="aluno-nome">Nome Completo</label>
        <input type="text" id="aluno-nome" placeholder="Seu nome completo">
      </div>

      <div class="campo">
        <label>RA e Dígito</label>
        <div class="ra-group">
          <input type="text" id="aluno-ra" inputmode="numeric" maxlength="13" placeholder="RA (13 números)">
          <input type="text" id="aluno-digito" inputmode="numeric" maxlength="2" placeholder="Dígito">
        </div>
      </div>
      
      <div class="campo">
        <label for="aluno-senha">Senha</label>
        <input type="password" id="aluno-senha" autocomplete="off" placeholder="Digite sua senha">
      </div>

      <div class="erro" id="erro-aluno-login"></div>
      <button class="btn" type="button" id="btn-login-aluno">Entrar →</button>
    </div>

    <div class="panel hidden" id="tela-aluno-materia">
      <p class="saudacao">Aba de Matérias</p>
      <p class="sub">Selecione qual matéria deseja consultar as notas.</p>
      <div class="campo">
        <label for="aluno-materia-select">Matéria</label>
        <select id="aluno-materia-select">
          <option value="">Selecione...</option>
          <option value="Artes">Artes</option>
          <option value="Biologia">Biologia</option>
          <option value="Ciências">Ciências</option>
          <option value="Educação Física">Educação Física</option>
          <option value="Física">Física</option>
          <option value="Geografia">Geografia</option>
          <option value="História">História</option>
          <option value="Inglês">Inglês</option>
          <option value="Matemática">Matemática</option>
          <option value="Português">Português</option>
          <option value="Química">Química</option>
        </select>
      </div>
      <div class="erro" id="erro-aluno-materia"></div>
      <button class="btn" type="button" id="btn-ver-boletim-aluno">Ver Boletim →</button>
      <button class="btn btn-ghost" type="button" onclick="mostrarTela('aluno-login')">← Voltar Login</button>
    </div>

    <div class="panel hidden" id="tela-aluno-boletim">
      <p class="saudacao">Boletim do Aluno</p>
      <p class="resultado-nome" id="aluno-resultado-nome"></p>
      <p class="resultado-nome" id="aluno-resultado-materia" style="margin-top:-14px; font-size:18px; color:var(--pen-blue);"></p>
      <table class="boletim-table">
        <thead><tr><th>Bimestre</th><th class="num">Nota</th></tr></thead>
        <tbody id="aluno-boletim-corpo"></tbody>
        <tfoot><tr class="media"><td>Média final</td><td class="num" id="aluno-boletim-media"></td></tr></tfoot>
      </table>
      <div class="stamp-wrap"><div class="stamp" id="aluno-stamp-resultado"></div></div>
      <p class="resultado-texto" id="aluno-resultado-texto"></p>
      <button class="btn btn-ghost" type="button" onclick="mostrarTela('aluno-materia')">← Escolher outra matéria</button>
      <button class="btn btn-ghost" type="button" onclick="trocarPerfil('aluno')">Sair do Sistema</button>
    </div>

    <!-- ======================= -->
    <!-- 2. ÁREA DOS PAIS        -->
    <!-- ======================= -->
    <div class="panel hidden" id="tela-pais-login">
      <p class="saudacao">Área dos Pais & Responsáveis</p>
      <p class="sub">Cadastre-se ou faça login com seus dados e telefone de contato.</p>

      <div class="campo">
        <label for="pais-nome">Nome do Responsável</label>
        <input type="text" id="pais-nome" placeholder="Seu nome completo">
      </div>

      <div class="campo">
        <label for="pais-telefone">Número de Telefone / WhatsApp (Com DDD)</label>
        <input type="tel" id="pais-telefone" placeholder="(11) 99999-9999">
        <p style="font-size:11px; color:var(--paper-shadow); margin:4px 2px 0;">Use o mesmo telefone que a escola cadastrou como responsável do(a) aluno(a).</p>
      </div>

      <div class="campo">
        <label for="pais-senha">Crie ou digite sua Senha</label>
        <input type="password" id="pais-senha" autocomplete="off" placeholder="Senha dos Pais">
      </div>

      <div class="erro" id="erro-pais-login"></div>
      <button class="btn" type="button" id="btn-login-pais" style="background-color: var(--pen-green);">Entrar no Portal da Família →</button>
    </div>

    <div class="panel hidden" id="tela-pais-busca">
      <p class="saudacao">Meus Filhos</p>
      <p class="sub" id="pais-boas-vindas">Alunos vinculados ao seu telefone.</p>

      <div class="campo" id="pais-filtro-wrap" style="display:none;">
        <label for="pais-busca-input">Filtrar por nome ou RA</label>
        <div class="busca-box">
          <input type="text" id="pais-busca-input" placeholder="Digite o nome do aluno ou RA..." style="margin-bottom:0;">
          <button class="btn" type="button" id="btn-pais-buscar" style="width:100px; padding:10px; margin-top:0;">Buscar</button>
        </div>
      </div>

      <div class="tabela-scroll">
        <table class="boletim-table">
          <thead>
            <tr>
              <th>Turma</th>
              <th>Nome do Aluno</th>
              <th>RA</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="pais-filhos-corpo"></tbody>
        </table>
      </div>

      <button class="btn btn-ghost" type="button" onclick="trocarPerfil('pais')">← Sair do Portal dos Pais</button>
    </div>

    <div class="panel hidden" id="tela-pais-boletim">
      <p class="saudacao">Boletim Escolar do Filho</p>
      <p class="resultado-nome" id="pais-filho-nome"></p>
      <p class="sub" style="text-align:center; margin-top:-14px;">Média anual completa por matéria</p>

      <div class="tabela-scroll">
        <table class="boletim-table">
          <thead>
            <tr>
              <th>Matéria</th>
              <th class="num">1º B</th>
              <th class="num">2º B</th>
              <th class="num">3º B</th>
              <th class="num">4º B</th>
              <th class="num">Média</th>
            </tr>
          </thead>
          <tbody id="pais-boletim-corpo"></tbody>
        </table>
      </div>

      <a id="link-whatsapp-prof" target="_blank" style="text-decoration: none;">
        <button class="btn btn-green" type="button" style="margin-bottom:10px;">📱 Falar com a Escola / Professores</button>
      </a>

      <button class="btn btn-ghost" type="button" id="btn-pais-voltar" onclick="mostrarTela('pais-busca')">← Voltar para Meus Filhos</button>
    </div>

    <!-- ============================================== -->
    <!-- 3. ÁREA UNIFICADA DO PROFESSOR E TUTORIA       -->
    <!-- ============================================== -->
    <div class="panel hidden" id="tela-prof-login">
      <p class="saudacao">Portal do Professor & Tutoria</p>
      <p class="sub">Acesso para lançamento de notas, gestão de turmas e emissão de boletins.</p>
      <div class="campo">
        <label for="prof-nome">Nome do Usuário</label>
        <input type="text" id="prof-nome" placeholder="Seu nome">
      </div>
      <div class="campo">
        <label for="prof-senha">Senha</label>
        <input type="password" id="prof-senha" autocomplete="off" placeholder="Senha de Acesso">
      </div>
      <div class="erro" id="erro-prof-login"></div>
      <button class="btn" type="button" id="btn-login-prof">Entrar no Portal →</button>
    </div>

    <div class="panel hidden" id="tela-prof-alunos">
      <p class="saudacao">Alunos Cadastrados</p>
      <p class="sub" id="prof-boas-vindas"></p>
      
      <!-- Botão para alternar para a Gestão de Turmas / Tutoria -->
      <button class="btn btn-green" type="button" style="margin-bottom:15px;" onclick="mostrarTela('dir-turmas')">📋 Ir para Gestão de Turmas & Tutoria</button>

      <div class="tabela-scroll">
        <table class="boletim-table">
          <thead><tr><th>Nome</th><th>Turma</th><th>Ações</th></tr></thead>
          <tbody id="prof-alunos-corpo"></tbody>
        </table>
      </div>
      <button class="btn btn-ghost" type="button" onclick="trocarPerfil('professor')">← Sair</button>
    </div>

    <div class="panel hidden" id="tela-prof-materia">
      <p class="saudacao">Ações para o Aluno</p>
      <div class="aluno-selecionado-box">
        <p class="aluno-selecionado-texto" id="prof-aluno-selecionado-texto"></p>
      </div>

      <button class="btn btn-pdf" type="button" onclick="abrirOpcoesPDFProfessor()">📄 Gerar PDF de Notas/Boletim</button>
      <hr style="margin:20px 0; border:0; border-top:1px dashed var(--rule);">

      <p class="sub">Ou selecione uma matéria para lançar notas:</p>
      <div class="campo">
        <label for="prof-materia-select">Matéria</label>
        <select id="prof-materia-select">
          <option value="">Selecione...</option>
          <option value="Artes">Artes</option>
          <option value="Biologia">Biologia</option>
          <option value="Ciências">Ciências</option>
          <option value="Educação Física">Educação Física</option>
          <option value="Física">Física</option>
          <option value="Geografia">Geografia</option>
          <option value="História">História</option>
          <option value="Inglês">Inglês</option>
          <option value="Matemática">Matemática</option>
          <option value="Português">Português</option>
          <option value="Química">Química</option>
        </select>
      </div>
      <div class="erro" id="erro-prof-materia"></div>
      <button class="btn" type="button" id="btn-prof-materia-continuar">Lançar Notas →</button>
      <button class="btn btn-ghost" type="button" onclick="mostrarTela('prof-alunos')">← Voltar</button>
    </div>

    <div class="panel hidden" id="tela-prof-notas">
      <p class="saudacao">Lançamento de Notas</p>
      <p class="sub" id="prof-sub-notas"></p>

        {nome:"Marcos Paulo",ra:"1000202400081",digito:"1",turma:"9B",materias:{}},
        {nome:"Alice Paulino",ra:"1000202400091",digito:"1",turma:"1A",materias:{}},
        {nome:"Karen Junqueira",ra:"1000202400101",digito:"1",turma:"1B",materias:{}},
        {nome:"Ulisses Campbell",ra:"1000202400111",digito:"1",turma:"1C",materias:{}},
        {nome:"Elaine Mickely",ra:"1000202400121",digito:"1",turma:"2A",materias:{}},
        {nome:"Otaviano Costa",ra:"1000202400131",digito:"1",turma:"2B",materias:{}},

  inicializarBanco();

  function obterBancoUsuarios() {
    return JSON.parse(localStorage.getItem('banco_usuarios')) || [];
  }

  // Normaliza telefone deixando apenas dígitos, para comparar sem depender de máscara/formatação
  function normalizarTelefone(tel) {
    return (tel || "").replace(/\D/g, "");
  }

  // ESTADOS GLOBAIS DE SESSÃO
  const estadoAluno = { nome:"", ra:"", digito:"", turma:"", materia:"", notas:[] };
  const estadoPais = { nome:"", telefone:"", filhoSelecionado: null, filhosVinculados: [] };
  const estadoProf = { nome:"", alunoSelecionado: null, materiaSelecionada: "" };
  const estadoDir = { nome:"", alunoSelecionado: null };

  const telas = {
    'aluno-login': document.getElementById('tela-aluno-login'),
    'aluno-materia': document.getElementById('tela-aluno-materia'),
    'aluno-boletim': document.getElementById('tela-aluno-boletim'),
    
    'pais-login': document.getElementById('tela-pais-login'),
    'pais-busca': document.getElementById('tela-pais-busca'),
    'pais-boletim': document.getElementById('tela-pais-boletim'),

    'prof-login': document.getElementById('tela-prof-login'),
    'prof-alunos': document.getElementById('tela-prof-alunos'),
    'prof-materia': document.getElementById('tela-prof-materia'),
    'prof-notas': document.getElementById('tela-prof-notas'),
    'prof-pdf': document.getElementById('tela-prof-pdf'),

    'dir-login': document.getElementById('tela-dir-login'),
    'dir-turmas': document.getElementById('tela-dir-turmas'),
    'dir-boletim': document.getElementById('tela-dir-boletim'),
    'dir-add-aluno': document.getElementById('tela-dir-add-aluno'),
    'dir-edit-aluno': document.getElementById('tela-dir-edit-aluno')
  };

  const ordemEtapas = {
    'aluno': ['aluno-login', 'aluno-materia', 'aluno-boletim'],
    'pais': ['pais-login', 'pais-busca', 'pais-boletim'],
    'prof': ['prof-login', 'prof-alunos', 'dir-turmas', 'prof-materia', 'prof-notas', 'prof-pdf'],
    'tutoria': ['dir-login', 'dir-turmas', 'dir-boletim', 'dir-add-aluno', 'dir-edit-aluno']
  };

  let perfilAtual = 'aluno';

  function trocarPerfil(perfil) {
    perfilAtual = perfil;
    document.querySelectorAll('.profile-btn').forEach(btn => btn.classList.remove('active'));
    
    if(perfil === 'aluno') {
      document.querySelectorAll('.profile-btn')[0].classList.add('active');
      mostrarTela('aluno-login');
    } else if(perfil === 'pais') {
      document.querySelectorAll('.profile-btn')[1].classList.add('active');
      mostrarTela('pais-login');
    } else if(perfil === 'professor') {
      document.querySelectorAll('.profile-btn')[2].classList.add('active');
      mostrarTela('prof-login');
    } else if(perfil === 'tutoria') {
      document.querySelectorAll('.profile-btn')[2].classList.add('active');
      mostrarTela('prof-login');
    }
  }

  function mostrarTela(nomeTela){
    Object.values(telas).forEach(t => t.classList.add('hidden'));
    if(telas[nomeTela]) telas[nomeTela].classList.remove('hidden');

    document.getElementById('steps-aluno').classList.toggle('hidden', perfilAtual !== 'aluno');
    document.getElementById('steps-pais').classList.toggle('hidden', perfilAtual !== 'pais');
    document.getElementById('steps-professor').classList.toggle('hidden', perfilAtual !== 'professor' && perfilAtual !== 'tutoria');
    document.getElementById('steps-tutoria').classList.add('hidden');

    const moduloKey = (perfilAtual === 'professor' || perfilAtual === 'tutoria') ? 'prof' : perfilAtual;
    const etapasModulo = ordemEtapas[moduloKey] || [];
    const containerSteps = document.getElementById('steps-professor');

    if(containerSteps && (perfilAtual === 'professor' || perfilAtual === 'tutoria')) {
      const tabs = containerSteps.querySelectorAll('.step-tab');
      const idxAtual = etapasModulo.indexOf(nomeTela);
      tabs.forEach(tab => {
        const idxTab = etapasModulo.indexOf(tab.dataset.step);
        tab.classList.toggle('active', idxTab === idxAtual);
        tab.classList.toggle('done', idxTab < idxAtual);
      });
    }
  }

  // ==========================================
  // 1. LÓGICA DO ALUNO
  // ==========================================
  document.getElementById('btn-login-aluno').addEventListener('click', () => {
    const turma = document.getElementById('aluno-turma-select').value;
    const nome = document.getElementById('aluno-nome').value.trim();
    const ra = document.getElementById('aluno-ra').value.trim();
    const digito = document.getElementById('aluno-digito').value.trim();
    const senha = document.getElementById('aluno-senha').value;
    const erro = document.getElementById('erro-aluno-login');
    erro.textContent = "";

    if(!turma){ erro.textContent = "Selecione sua turma."; return; }
    if(!nome){ erro.textContent = "Digite seu nome completo."; return; }
    if(!ra || !digito){ erro.textContent = "Informe o RA e o dígito."; return; }

    const banco = obterBancoUsuarios();
    const aluno = banco.find(u => u.ra === ra && u.digito === digito);

    if(!aluno){ erro.textContent = "Aluno não encontrado. Verifique o RA e dígito."; return; }
    if(aluno.turma !== turma){ erro.textContent = `Acesso negado! Este aluno pertence à turma ${aluno.turma}.`; return; }
    if(senha !== SENHA_ALUNO){ erro.textContent = "Senha incorreta."; return; }

    estadoAluno.nome = aluno.nome;
    estadoAluno.ra = ra;
    estadoAluno.digito = digito;
    estadoAluno.turma = aluno.turma;

    mostrarTela('aluno-materia');
  });

  document.getElementById('btn-ver-boletim-aluno').addEventListener('click', () => {
    const materia = document.getElementById('aluno-materia-select').value;
    const erro = document.getElementById('erro-aluno-materia');
    erro.textContent = "";

    if(!materia){ erro.textContent = "Selecione uma matéria."; return; }

    const banco = obterBancoUsuarios();
    const aluno = banco.find(u => u.ra === estadoAluno.ra);

    if(!aluno || !aluno.materias || !aluno.materias[materia]) {
        erro.textContent = "Notas ainda não lançadas para essa matéria."; return;
    }

    estadoAluno.materia = materia;
    estadoAluno.notas = aluno.materias[materia]; 

    document.getElementById('aluno-resultado-nome').textContent = `${estadoAluno.nome} (RA: ${estadoAluno.ra}-${estadoAluno.digito})`;
    document.getElementById('aluno-resultado-materia').textContent = `Matéria: ${materia}`;

    const corpo = document.getElementById('aluno-boletim-corpo');
    corpo.innerHTML = "";
    estadoAluno.notas.forEach((nota, idx) => {
      corpo.innerHTML += `<tr><td>${idx + 1}º Bimestre</td><td class="num">${nota.toFixed(1)}</td></tr>`;
    });

    const media = estadoAluno.notas.reduce((s, n) => s + n, 0) / estadoAluno.notas.length;
    document.getElementById('aluno-boletim-media').textContent = media.toFixed(2);
    
    const stamp = document.getElementById('aluno-stamp-resultado');
    const texto = document.getElementById('aluno-resultado-texto');

    if(media >= 5){
      stamp.textContent = "Aprovado"; stamp.className = "stamp ok";
      texto.textContent = `Parabéns, você atingiu a média em ${materia}!`;
    } else {
      stamp.textContent = "Reprovado"; stamp.className = "stamp rec"; 
      texto.textContent = `Sua média ficou abaixo de 5.0 em ${materia}.`;
    }

    mostrarTela('aluno-boletim');
  });

  // ==========================================
  // 2. LÓGICA DOS PAIS / RESPONSÁVEIS
  // ==========================================

    const nome = document.getElementById('pais-nome').value.trim();
    const telOriginal = document.getElementById('pais-telefone').value.trim();
    const tel = normalizarTelefone(telOriginal);
    const senha = document.getElementById('pais-senha').value;
    const erro = document.getElementById('erro-pais-login');
    erro.textContent = "";

    if(!nome){ erro.textContent = "Por favor, digite seu nome."; return; }
    if(!tel || tel.length < 8){ erro.textContent = "Informe um telefone/WhatsApp válido para contato dos professores."; return; }
    if(!senha){ erro.textContent = "Digite uma senha para acessar."; return; }

    estadoPais.nome = nome;
    estadoPais.telefone = telOriginal;

    // Busca automaticamente os alunos vinculados a este telefone de responsável
    // (vínculo feito pelo professor/tutoria na Gestão de Turmas)
    const banco = obterBancoUsuarios();
    const filhosVinculados = banco.filter(u => u.responsavelTelefone && u.responsavelTelefone === tel);
    estadoPais.filhosVinculados = filhosVinculados;

    if(filhosVinculados.length === 0) {
      erro.textContent = "Nenhum aluno vinculado a este telefone ainda. Procure a coordenação/tutoria da escola para vincular seu cadastro ao(à) aluno(a).";
      return;
    }

    if(filhosVinculados.length === 1) {
      // Só tem um filho vinculado: vai direto para o boletim, sem tela de busca
      verBoletimPai(filhosVinculados[0].ra);
      return;
    }

    // Mais de um filho vinculado ao mesmo telefone (irmãos): mostra a lista para escolher
    document.getElementById('pais-boas-vindas').textContent = `Bem-vindo(a), ${nome}. Selecione o(a) filho(a):`;
    document.getElementById('pais-filtro-wrap').style.display = filhosVinculados.length > 3 ? '' : 'none';
    carregarFilhosVinculados("");
    mostrarTela('pais-busca');
  });

  document.getElementById('btn-pais-buscar').addEventListener('click', () => {
    const termo = document.getElementById('pais-busca-input').value.trim();
    carregarFilhosVinculados(termo);
  });

  function carregarFilhosVinculados(termo) {
    const corpo = document.getElementById('pais-filhos-corpo');
    corpo.innerHTML = "";

    const lista = (estadoPais.filhosVinculados || []).filter(u =>
      u.nome.toLowerCase().includes(termo.toLowerCase()) ||
      u.ra.includes(termo)
    );

    if(lista.length === 0) {
      corpo.innerHTML = `<tr><td colspan="4" class="vazio-tabela">Nenhum filho encontrado com esses dados.</td></tr>`;
      return;
    }

    lista.forEach(aluno => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${aluno.turma || "S/T"}</td>
        <td>${aluno.nome}</td>
        <td>${aluno.ra}</td>
        <td><button class="btn-selecionar" onclick="verBoletimPai('${aluno.ra}')">Ver Notas</button></td>
      `;
      corpo.appendChild(tr);
    });
  }

  function verBoletimPai(raAluno) {
    const banco = obterBancoUsuarios();
    const aluno = banco.find(u => u.ra === raAluno);
    if(!aluno) return;

    estadoPais.filhoSelecionado = aluno;
    document.getElementById('pais-filho-nome').textContent = `${aluno.nome} (${aluno.turma || "Sem Turma"}) — RA: ${aluno.ra}`;

    // Se o responsável só tem um filho vinculado, o botão "voltar" sai do portal;
    // se tiver mais de um (irmãos), volta para a lista de seleção.
    const temVariosFilhos = (estadoPais.filhosVinculados || []).length > 1;
    const btnVoltar = document.getElementById('btn-pais-voltar');
    if(temVariosFilhos) {
      btnVoltar.textContent = "← Voltar para Meus Filhos";
      btnVoltar.onclick = () => mostrarTela('pais-busca');
    } else {
      btnVoltar.textContent = "← Sair do Portal dos Pais";
      btnVoltar.onclick = () => trocarPerfil('pais');
    }

    const corpo = document.getElementById('pais-boletim-corpo');
    corpo.innerHTML = "";

    LISTA_MATERIAS.forEach(mat => {
      const notas = (aluno.materias && aluno.materias[mat]) ? aluno.materias[mat] : [];
      const n1 = notas[0] !== undefined ? notas[0].toFixed(1) : "-";
      const n2 = notas[1] !== undefined ? notas[1].toFixed(1) : "-";
      const n3 = notas[2] !== undefined ? notas[2].toFixed(1) : "-";
      const n4 = notas[3] !== undefined ? notas[3].toFixed(1) : "-";

      let mediaFormatada = "-";
      let corMedia = "var(--ink)";

      if(notas.length === 4) {
        const media = notas.reduce((a,b)=>a+b, 0) / 4;
        mediaFormatada = media.toFixed(1);
        corMedia = media >= 5.0 ? "var(--pen-green)" : "var(--pen-red)";
      }

      corpo.innerHTML += `
        <tr>
          <td>${mat}</td>
          <td class="num">${n1}</td>
          <td class="num">${n2}</td>
          <td class="num">${n3}</td>
          <td class="num">${n4}</td>
          <td class="num" style="font-weight:bold; color:${corMedia}">${mediaFormatada}</td>
        </tr>
      `;
    });

    const mensagem = encodeURIComponent(`Olá, sou ${estadoPais.nome}, responsável pelo aluno ${aluno.nome} (${aluno.turma}). Meu telefone é ${estadoPais.telefone}. Gostaria de conversar sobre as notas do boletim.`);
    document.getElementById('link-whatsapp-prof').href = `https://api.whatsapp.com/send?text=${mensagem}`;

    mostrarTela('pais-boletim');
  }

  // ==========================================
  // 3. LÓGICA DO PROFESSOR E GERADOR DE PDF
  // ==========================================
  document.getElementById('btn-login-prof').addEventListener('click', () => {
    const nome = document.getElementById('prof-nome').value.trim();

    if(!nome){ erro.textContent = "Digite seu nome."; return; }

    estadoProf.nome = nome;

      const erroEl = document.getElementById('erro-prof-notas');
      const sucessoEl = document.getElementById('sucesso-prof-notas');

          notas.push(num);
      }

      let banco = obterBancoUsuarios();

  function atualizarPreviewPDF() {
    const aluno = estadoProf.alunoSelecionado;
    if (!aluno) return;

    const tipo = document.getElementById('select-tipo-pdf').value;
    const tabela = document.getElementById('tabela-pdf-preview');
    let html = "";

    if (tipo === "TODOS") {
      html = `
        <thead>
          <tr>
            <th>Matéria</th>
            <th class="num">1º B</th>
            <th class="num">2º B</th>
            <th class="num">3º B</th>

            <th class="num">Média</th>
          </tr>
        </thead>
        <tbody>
      `;

      LISTA_MATERIAS.forEach(mat => {
        const notas = (aluno.materias && aluno.materias[mat]) ? aluno.materias[mat] : [];
        
        const n1 = (notas[0] !== undefined && notas[0] !== null) ? notas[0].toFixed(1) : "N/A";
        const n2 = (notas[1] !== undefined && notas[1] !== null) ? notas[1].toFixed(1) : "N/A";
        const n3 = (notas[2] !== undefined && notas[2] !== null) ? notas[2].toFixed(1) : "N/A";
        const n4 = (notas[3] !== undefined && notas[3] !== null) ? notas[3].toFixed(1) : "N/A";

        const notasValidas = notas.filter(n => n !== undefined && n !== null);
        let media = "N/A";
        if (notasValidas.length > 0) {
          media = (notasValidas.reduce((a, b) => a + b, 0) / notasValidas.length).toFixed(1);
        }

        html += `
          <tr>
            <td style="font-weight: 500;">${mat}</td>
            <td class="num">${n1}</td>
            <td class="num">${n2}</td>
            <td class="num">${n3}</td>
            <td class="num">${n4}</td>
            <td class="num" style="font-weight:bold;">${media}</td>
          </tr>
        `;
      });

    } else {
      const bimIndex = parseInt(tipo);
      const nomesBimestres = ["1º Bimestre", "2º Bimestre", "3º Bimestre", "4º Bimestre"];

      html = `
        <thead>
          <tr>
            <th>Matéria</th>
            <th class="num">Nota (${nomesBimestres[bimIndex]})</th>
          </tr>
        </thead>
        <tbody>
      `;

      LISTA_MATERIAS.forEach(mat => {
        const notas = (aluno.materias && aluno.materias[mat]) ? aluno.materias[mat] : [];
        const notaBimestre = (notas[bimIndex] !== undefined && notas[bimIndex] !== null) 
          ? notas[bimIndex].toFixed(1) 
          : "N/A";

        html += `
          <tr>
            <td style="font-weight: 500;">${mat}</td>
            <td class="num" style="font-weight:bold;">${notaBimestre}</td>
          </tr>
        `;
      });
    }

    html += `</tbody>`;
    tabela.innerHTML = html;
  }

  function executarDownloadPDF() {
    const elemento = document.getElementById('area-impressao-pdf');
    const aluno = estadoProf.alunoSelecionado;

    const clone = elemento.cloneNode(true);
    clone.style.width = '700px';
    clone.style.padding = '20px';
    clone.style.background = '#ffffff';
    clone.style.color = '#000000';
    clone.style.boxSizing = 'border-box';

    const containerTemp = document.createElement('div');
    containerTemp.style.position = 'absolute';
    containerTemp.style.left = '-9999px';
    containerTemp.style.top = '0';
    containerTemp.style.width = '750px';
    containerTemp.appendChild(clone);
    document.body.appendChild(containerTemp);

    const configuracoes = {
      margin:       [10, 10, 10, 10],
      filename:     `Boletim_${aluno ? aluno.nome.replace(/\s+/g, '_') : 'Aluno'}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true, scrollX: 0, scrollY: 0, windowWidth: 800 },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
    };

    html2pdf().set(configuracoes).from(clone).save().then(() => {
      document.body.removeChild(containerTemp);
    }).catch(err => {
      console.error(err);
      if(document.body.contains(containerTemp)) document.body.removeChild(containerTemp);
    });
  }

<script>
(function () {
  const btnConect = document.getElementById('btn-conect');
  const btnTutoria = document.getElementById('btn-tutoria');
  const modConect = document.getElementById('modulo-conect');
  const modTutoria = document.getElementById('modulo-tutoria');
  const frameConect = document.getElementById('frame-conect');
  const frameTutoria = document.getElementById('frame-tutoria');

  function carregarFrame(frame, templateId) {
    const template = document.getElementById(templateId);
    if (!frame.dataset.loaded) {
      frame.srcdoc = template.innerHTML;
      frame.dataset.loaded = 'true';
    }
  }

  function ativarModulo(modulo) {
    const conect = modulo === 'conect';
    modConect.classList.toggle('active', conect);
    modTutoria.classList.toggle('active', !conect);
    btnConect.classList.toggle('active', conect);
    btnTutoria.classList.toggle('active', !conect);
    btnConect.setAttribute('aria-selected', String(conect));
    btnTutoria.setAttribute('aria-selected', String(!conect));
    modConect.setAttribute('aria-hidden', String(!conect));
    modTutoria.setAttribute('aria-hidden', String(conect));

    if (conect) carregarFrame(frameConect, 'codigo-conect-escola');
    else carregarFrame(frameTutoria, 'codigo-tutoria');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  btnConect.addEventListener('click', function () { ativarModulo('conect'); });
  btnTutoria.addEventListener('click', function () { ativarModulo('tutoria'); });

  // Carrega somente o módulo inicial.
  carregarFrame(frameConect, 'codigo-conect-escola');
})();
</script>
